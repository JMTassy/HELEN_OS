<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HELEN OS</title>
<style>
:root {
  --black:   #080808;
  --surface: #0e0e0e;
  --graph:   #161616;
  --border:  #202020;
  --off-white: #e6e1d6;
  --silver:    #7a7874;
  --silver-hi: #a09c96;
  --signal:    #c49a3c;
  --signal-bg: rgba(196,154,60,0.08);
  --serif: Georgia, 'Times New Roman', serif;
  --sans:  -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
  --mono:  'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: var(--black);
  color: var(--off-white);
  font-family: var(--sans);
  font-size: 11px;
}

body { display: flex; flex-direction: column; }

/* ── HEADER ──────────────────────────────────────────────────────────────── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  height: 40px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
}

.title {
  font-family: var(--serif);
  font-size: 13px;
  font-weight: normal;
  letter-spacing: 0.22em;
  color: var(--off-white);
}

.title em { color: var(--signal); font-style: normal; }

.header-right {
  display: flex;
  align-items: center;
  gap: 20px;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--silver);
  letter-spacing: 0.08em;
}

.sovereign-badge {
  border: 1px solid var(--signal);
  color: var(--signal);
  padding: 2px 7px;
  font-size: 8px;
  letter-spacing: 0.15em;
}

/* ── LAYOUT ──────────────────────────────────────────────────────────────── */
.layout {
  display: grid;
  grid-template-columns: 220px 1fr 220px;
  flex: 1;
  overflow: hidden;
}

/* ── SIDE PANELS ─────────────────────────────────────────────────────────── */
.side {
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  overflow: hidden;
  background: var(--surface);
}

.side.right { border-right: none; border-left: 1px solid var(--border); }

.side-label {
  padding: 9px 14px;
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 0.28em;
  color: var(--silver);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  text-transform: uppercase;
}

.side-body {
  flex: 1;
  overflow-y: auto;
}

.side-body::-webkit-scrollbar { width: 2px; }
.side-body::-webkit-scrollbar-thumb { background: var(--border); }

/* ── OBJECT CARDS ────────────────────────────────────────────────────────── */
.obj-card {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  position: relative;
  transition: background 0.12s;
}

.obj-card:hover { background: rgba(255,255,255,0.02); }

.obj-card.active {
  background: rgba(196,154,60,0.06);
}

.obj-card.active::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 2px;
  background: var(--signal);
}

.obj-top {
  display: flex;
  justify-content: space-between;
  margin-bottom: 4px;
}

.obj-type {
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

.obj-type.kernel   { color: var(--signal); }
.obj-type.goblin   { color: var(--silver-hi); }
.obj-type.terminal { color: var(--silver); }

.obj-conf {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--silver);
}

.obj-subject {
  font-size: 10px;
  color: var(--off-white);
  line-height: 1.4;
  margin-bottom: 5px;
}

.obj-foot {
  display: flex;
  gap: 8px;
  font-family: var(--mono);
  font-size: 8px;
  color: var(--silver);
}

.obj-receipts { color: var(--signal); }

/* ── CONSTELLATION ───────────────────────────────────────────────────────── */
.center {
  position: relative;
  background: var(--black);
  overflow: hidden;
}

#graph { width: 100%; height: 100%; display: block; }

/* ── NODE DETAIL ─────────────────────────────────────────────────────────── */
#detail {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: var(--surface);
  border-top: 1px solid var(--signal);
  padding: 14px 20px 14px 20px;
  font-family: var(--mono);
  font-size: 10px;
  line-height: 1.9;
  display: none;
  max-height: 180px;
  overflow-y: auto;
}

#detail.on { display: block; }

.detail-close {
  position: absolute;
  right: 16px; top: 12px;
  cursor: pointer;
  color: var(--silver);
  font-size: 11px;
  background: none; border: none;
}

.dr { display: flex; gap: 0; flex-wrap: wrap; }
.dk { color: var(--silver); min-width: 100px; }
.dv { color: var(--off-white); margin-right: 24px; }
.ds { color: var(--signal); }

/* ── LEDGER PANEL ────────────────────────────────────────────────────────── */
.mayor-block {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
}

.mayor-label {
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 0.2em;
  color: var(--silver);
  margin-bottom: 4px;
}

.mayor-verdict {
  font-family: var(--serif);
  font-size: 14px;
  color: var(--signal);
  letter-spacing: 0.1em;
}

.receipt-row {
  padding: 9px 14px;
  border-bottom: 1px solid var(--border);
}

.receipt-row:hover { background: rgba(255,255,255,0.02); }

.r-hash {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--signal);
  letter-spacing: 0.06em;
  margin-bottom: 2px;
}

.r-type {
  font-size: 10px;
  color: var(--off-white);
  margin-bottom: 2px;
}

.r-time {
  font-family: var(--mono);
  font-size: 8px;
  color: var(--silver);
}

.empty {
  padding: 20px 14px;
  font-family: var(--serif);
  font-size: 10px;
  color: var(--silver);
  font-style: italic;
}

/* ── DENSITY BAR ─────────────────────────────────────────────────────────── */
#density {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--silver);
}

#density span { color: var(--off-white); }
</style>
</head>
<body>

<div class="header">
  <div class="title">HELEN <em>OS</em></div>
  <div class="header-right">
    <div id="density">FIELD — <span id="n-objects">0</span> objects · <span id="n-edges">0</span> edges</div>
    <div class="sovereign-badge">NON_SOVEREIGN · NO_SHIP</div>
    <div id="clock">–</div>
  </div>
</div>

<div class="layout">

  <!-- LEFT: Object Field -->
  <div class="side">
    <div class="side-label">Object Field</div>
    <div class="side-body" id="object-list">
      <div class="empty">Connecting to kernel…</div>
    </div>
  </div>

  <!-- CENTER: Constellation -->
  <div class="center">
    <svg id="graph"></svg>
    <div id="detail">
      <button class="detail-close" onclick="deselect()">✕</button>
      <div id="detail-body"></div>
    </div>
  </div>

  <!-- RIGHT: Sovereign Ledger -->
  <div class="side right">
    <div class="side-label">Sovereign Ledger</div>
    <div class="side-body" id="ledger-list">
      <div class="mayor-block">
        <div class="mayor-label">MAYOR VERDICT</div>
        <div class="mayor-verdict">NO_SHIP</div>
      </div>
      <div class="empty">Awaiting receipts…</div>
    </div>
  </div>

</div>

<script>
// ── Clock ─────────────────────────────────────────────────────────────────
setInterval(() => {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('en-GB', { hour12: false });
}, 1000);

// ── Force Simulation ──────────────────────────────────────────────────────
const GRAVITY   = 0.006;
const REPEL_R   = 85;
const REPEL_K   = 1000;
const SPRING_K  = 0.035;
const DAMP      = 0.86;
const VMAX      = 2.5;

let nodes = [], links = [], all_objects = [], selected_id = null;

function init_sim(objects, edges) {
  const svg = document.getElementById('graph');
  const W = svg.clientWidth  || 600;
  const H = svg.clientHeight || 400;
  const cx = W / 2, cy = H / 2;

  // Preserve positions if id already exists
  const old_map = {};
  nodes.forEach(n => old_map[n.id] = { x: n.x, y: n.y });

  nodes = objects.map((obj, i) => {
    if (old_map[obj.id]) return { ...old_map[obj.id], vx: 0, vy: 0, id: obj.id, obj };
    const angle = (i / objects.length) * Math.PI * 2;
    const r = 100 + Math.random() * 100;
    return { id: obj.id, x: cx + Math.cos(angle) * r, y: cy + Math.sin(angle) * r,
             vx: 0, vy: 0, obj };
  });

  const nmap = {};
  nodes.forEach(n => nmap[n.id] = n);
  links = edges.map(e => ({ s: nmap[e.source], t: nmap[e.target], w: e.weight || 0.5 }))
               .filter(e => e.s && e.t);

  all_objects = objects;
  document.getElementById('n-objects').textContent = objects.length;
  document.getElementById('n-edges').textContent   = edges.length;
}

function step_sim() {
  const svg = document.getElementById('graph');
  const W = svg.clientWidth  || 600;
  const H = svg.clientHeight || 400;
  const cx = W / 2, cy = H / 2;

  // Gravity
  for (const n of nodes) {
    n.vx += (cx - n.x) * GRAVITY;
    n.vy += (cy - n.y) * GRAVITY;
  }

  // Repulsion
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d2 = dx * dx + dy * dy || 1;
      const d  = Math.sqrt(d2);
      if (d < REPEL_R) {
        const f = REPEL_K / d2;
        const nx = dx / d, ny = dy / d;
        a.vx -= nx * f * 0.5; a.vy -= ny * f * 0.5;
        b.vx += nx * f * 0.5; b.vy += ny * f * 0.5;
      }
    }
  }

  // Spring
  for (const l of links) {
    const dx = l.t.x - l.s.x, dy = l.t.y - l.s.y;
    l.s.vx += dx * SPRING_K * l.w; l.s.vy += dy * SPRING_K * l.w;
    l.t.vx -= dx * SPRING_K * l.w; l.t.vy -= dy * SPRING_K * l.w;
  }

  // Integrate
  for (const n of nodes) {
    n.vx *= DAMP; n.vy *= DAMP;
    const spd = Math.sqrt(n.vx * n.vx + n.vy * n.vy);
    if (spd > VMAX) { n.vx = n.vx / spd * VMAX; n.vy = n.vy / spd * VMAX; }
    n.x = Math.max(16, Math.min(W - 16, n.x + n.vx));
    n.y = Math.max(16, Math.min(H - 16, n.y + n.vy));
  }
}

// ── SVG Render ────────────────────────────────────────────────────────────
const NS = 'http://www.w3.org/2000/svg';
let eg, ng;

function init_svg() {
  const svg = document.getElementById('graph');
  svg.innerHTML = '';
  // subtle grid (classified-terminal feel)
  const defs = document.createElementNS(NS, 'defs');
  const pat  = document.createElementNS(NS, 'pattern');
  pat.setAttribute('id', 'grid'); pat.setAttribute('width', '40'); pat.setAttribute('height', '40');
  pat.setAttribute('patternUnits', 'userSpaceOnUse');
  const pl = document.createElementNS(NS, 'path');
  pl.setAttribute('d', 'M 40 0 L 0 0 0 40');
  pl.setAttribute('fill', 'none'); pl.setAttribute('stroke', 'rgba(255,255,255,0.018)');
  pl.setAttribute('stroke-width', '0.5');
  pat.appendChild(pl); defs.appendChild(pat); svg.appendChild(defs);
  const rect = document.createElementNS(NS, 'rect');
  rect.setAttribute('width', '100%'); rect.setAttribute('height', '100%');
  rect.setAttribute('fill', 'url(#grid)');
  svg.appendChild(rect);
  eg = document.createElementNS(NS, 'g'); ng = document.createElementNS(NS, 'g');
  svg.appendChild(eg); svg.appendChild(ng);
}

function render_frame() {
  // Edges
  while (eg.firstChild) eg.removeChild(eg.firstChild);
  for (const l of links) {
    const line = document.createElementNS(NS, 'line');
    line.setAttribute('x1', l.s.x); line.setAttribute('y1', l.s.y);
    line.setAttribute('x2', l.t.x); line.setAttribute('y2', l.t.y);
    const alpha = l.w > 0.6 ? 0.18 : 0.09;
    line.setAttribute('stroke', `rgba(196,154,60,${l.w > 0.6 ? alpha : 0.07})`);
    line.setAttribute('stroke-width', l.w > 0.6 ? '0.8' : '0.4');
    eg.appendChild(line);
  }

  // Nodes
  while (ng.firstChild) ng.removeChild(ng.firstChild);
  for (const n of nodes) {
    const obj = n.obj;
    const is_sel    = selected_id === obj.id;
    const is_kernel = obj.provenance === 'kernel';
    const conf      = obj.confidence || 0.5;
    const r_base    = 2.5 + conf * 5;

    const g = document.createElementNS(NS, 'g');
    g.setAttribute('transform', `translate(${n.x.toFixed(1)},${n.y.toFixed(1)})`);
    g.style.cursor = 'pointer';

    // Halo for receipt-verified or selected
    if (obj.receipts > 0 || is_sel) {
      const halo = document.createElementNS(NS, 'circle');
      halo.setAttribute('r', r_base + (is_sel ? 7 : 4));
      halo.setAttribute('fill', is_kernel ? 'rgba(196,154,60,0.10)' : 'rgba(160,156,150,0.06)');
      g.appendChild(halo);
    }

    // Selection ring
    if (is_sel) {
      const ring = document.createElementNS(NS, 'circle');
      ring.setAttribute('r', r_base + 4);
      ring.setAttribute('fill', 'none');
      ring.setAttribute('stroke', '#c49a3c');
      ring.setAttribute('stroke-width', '1');
      g.appendChild(ring);
    }

    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('r', r_base);
    if (is_kernel) {
      c.setAttribute('fill', '#c49a3c');
    } else if (obj.provenance === 'goblin') {
      c.setAttribute('fill', `rgba(160,156,150,${0.3 + conf * 0.6})`);
    } else {
      c.setAttribute('fill', `rgba(100,98,95,${0.4 + conf * 0.4})`);
    }
    g.appendChild(c);

    // Label for high-conf or selected
    if (conf >= 0.75 || is_sel) {
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', r_base + 5);
      t.setAttribute('y', 3.5);
      t.setAttribute('fill', is_kernel ? 'rgba(196,154,60,0.7)' : 'rgba(122,120,116,0.7)');
      t.setAttribute('font-size', '8');
      t.setAttribute('font-family', '-apple-system, sans-serif');
      t.textContent = (obj.subject || '').slice(0, 24);
      g.appendChild(t);
    }

    g.addEventListener('click', () => select_obj(obj));
    ng.appendChild(g);
  }
}

// ── Animation ─────────────────────────────────────────────────────────────
function loop() {
  step_sim();
  render_frame();
  requestAnimationFrame(loop);
}

// ── Selection ─────────────────────────────────────────────────────────────
function select_obj(obj) {
  selected_id = selected_id === obj.id ? null : obj.id;
  if (selected_id) show_detail(obj);
  else             hide_detail();
  sync_card_states();
}

function deselect() { selected_id = null; hide_detail(); sync_card_states(); }

function show_detail(obj) {
  const el = document.getElementById('detail');
  el.classList.add('on');
  document.getElementById('detail-body').innerHTML = `
    <div class="dr">
      <span class="dk">type</span>      <span class="ds">${obj.type}</span>
      <span class="dk">provenance</span><span class="dv">${obj.provenance}</span>
      <span class="dk">confidence</span><span class="dv">${(obj.confidence||0).toFixed(3)}</span>
      <span class="dk">receipts</span>  <span class="ds">${obj.receipts}</span>
      ${obj.hash ? `<span class="dk">hash</span><span class="dv" style="font-family:monospace;">${obj.hash}</span>` : ''}
    </div>
    <div class="dr" style="margin-top:4px;">
      <span class="dk">subject</span>
      <span class="dv" style="flex:1;">${obj.subject||'–'}</span>
    </div>
    ${(obj.relations||[]).length ? `<div class="dr" style="margin-top:4px;"><span class="dk">relations</span><span class="dv">${obj.relations.join(' · ')}</span></div>` : ''}
  `;
}

function hide_detail() {
  document.getElementById('detail').classList.remove('on');
}

function sync_card_states() {
  document.querySelectorAll('.obj-card').forEach(el => {
    el.classList.toggle('active', el.dataset.id === selected_id);
  });
}

// ── Left Panel ────────────────────────────────────────────────────────────
function render_objects(objects) {
  const el = document.getElementById('object-list');
  if (!objects.length) { el.innerHTML = '<div class="empty">No objects in field.</div>'; return; }
  el.innerHTML = objects.slice(0, 40).map(obj => `
    <div class="obj-card${selected_id===obj.id?' active':''}" data-id="${obj.id}"
         onclick="select_from_card('${obj.id.replace(/'/g,'\\\')}')">
      <div class="obj-top">
        <span class="obj-type ${obj.provenance}">${obj.type}</span>
        <span class="obj-conf">${(obj.confidence||0).toFixed(2)}</span>
      </div>
      <div class="obj-subject">${(obj.subject||'–').slice(0,58)}</div>
      <div class="obj-foot">
        <span>${obj.provenance}</span>
        ${obj.receipts > 0 ? `<span class="obj-receipts">${obj.receipts}R</span>` : ''}
        ${obj.hash ? `<span style="font-family:monospace;">${obj.hash.slice(0,8)}</span>` : ''}
      </div>
    </div>`).join('');
}

function select_from_card(id) {
  const obj = all_objects.find(o => o.id === id);
  if (obj) select_obj(obj);
}

// ── Right Panel ───────────────────────────────────────────────────────────
function render_ledger(events) {
  const el = document.getElementById('ledger-list');
  const mayor = `<div class="mayor-block">
    <div class="mayor-label">MAYOR VERDICT</div>
    <div class="mayor-verdict">NO_SHIP</div>
  </div>`;
  if (!events.length) { el.innerHTML = mayor + '<div class="empty">No events.</div>'; return; }
  el.innerHTML = mayor + [...events].reverse().slice(0, 30).map(e => `
    <div class="receipt-row">
      <div class="r-hash">${(e.event_hash||e.payload_hash||'').slice(0,12)||'–'}</div>
      <div class="r-type">${e.event_type||'–'}</div>
      <div class="r-time">${fmt_ts(e.timestamp_utc)}</div>
    </div>`).join('');
}

function fmt_ts(ts) {
  if (!ts) return '–';
  try { return new Date(ts).toLocaleTimeString('en-GB', { hour12:false }); }
  catch { return (ts||'').slice(11,19); }
}

// ── Fetch ─────────────────────────────────────────────────────────────────
async function refresh() {
  try {
    const [s, k] = await Promise.all([fetch('/api/semantic'), fetch('/api/kernel')]);
    const sem    = await s.json();
    const kernel = await k.json();
    init_sim(sem.objects||[], sem.edges||[]);
    render_objects(sem.objects||[]);
    render_ledger(kernel.ledger_events||[]);
  } catch(e) { console.error('refresh', e); }
}

// ── Boot ──────────────────────────────────────────────────────────────────
init_svg();
refresh();
setInterval(refresh, 8000);
loop();
</script>
</body>
</html>
