<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HELEN OS · HOME</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#050508;color:#00d4ff;font-family:'Courier New',monospace;height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* ── BRIEF PANEL ─────────────────────────────────────────────────────────── */
#brief{
  flex:0 0 auto;padding:16px 28px 12px;
  border-bottom:1px solid rgba(0,212,255,.10);
  background:rgba(5,5,8,.97);z-index:10;
  overflow-y:auto;max-height:46vh;
}
#brief-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;}
#brief-title{font-size:10px;letter-spacing:.20em;color:rgba(0,212,255,.38);text-transform:uppercase;}
#brief-ts{font-size:9px;color:rgba(0,212,255,.22);letter-spacing:.10em;}

#mode-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
#mode-label{font-size:9px;color:rgba(0,212,255,.30);letter-spacing:.14em;}
.mode-btn{
  font-family:'Courier New',monospace;font-size:9px;letter-spacing:.14em;
  border:1px solid rgba(0,212,255,.20);padding:3px 10px;cursor:pointer;
  background:transparent;color:rgba(0,212,255,.38);text-transform:uppercase;transition:all .15s;
}
.mode-btn.active{background:rgba(0,212,255,.10);color:#00d4ff;border-color:rgba(0,212,255,.50);}

#helen-brief-line{font-size:12px;color:#ffaa00;letter-spacing:.04em;margin-bottom:14px;padding-left:1px;}

#debt-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
#debt-dot{
  width:8px;height:8px;border-radius:50%;background:#ffaa00;
  box-shadow:0 0 6px #ffaa00;flex-shrink:0;
  animation:debt-pulse 2.2s ease-in-out infinite;
}
#debt-dot.zero{background:rgba(255,170,0,.18);box-shadow:none;animation:none;}
@keyframes debt-pulse{0%,100%{box-shadow:0 0 4px #ffaa00;opacity:.7;}50%{box-shadow:0 0 14px #ffaa00;opacity:1;}}
#debt-label{font-size:10px;color:#ffaa00;letter-spacing:.10em;}
#debt-label.zero{color:rgba(255,170,0,.30);}

#queue{display:flex;flex-direction:column;gap:5px;}
.q-item{
  display:flex;align-items:center;gap:10px;padding:6px 10px;
  border:1px solid rgba(255,170,0,.15);background:rgba(255,170,0,.025);
  transition:opacity .28s,transform .28s;
}
.q-item.confirmed{border-color:rgba(0,255,136,.25);background:rgba(0,255,136,.03);}
.q-item.rejected{opacity:.25;}
.q-item.out{opacity:0;transform:translateX(36px);}
.q-bullet{color:#ffaa00;font-size:10px;flex-shrink:0;width:12px;}
.q-brief{flex:1;font-size:10px;color:rgba(0,212,255,.78);letter-spacing:.03em;}
.q-src{font-size:8px;color:rgba(0,212,255,.25);letter-spacing:.10em;flex-shrink:0;margin-right:6px;}
.q-btns{display:flex;gap:5px;flex-shrink:0;}
button.btn{
  font-family:'Courier New',monospace;font-size:8px;letter-spacing:.12em;
  border:1px solid;padding:2px 7px;cursor:pointer;background:transparent;
  text-transform:uppercase;transition:background .12s;
}
.btn-c{color:#00ff88;border-color:rgba(0,255,136,.35);}
.btn-c:hover{background:rgba(0,255,136,.10);}
.btn-r{color:rgba(255,51,85,.65);border-color:rgba(255,51,85,.22);}
.btn-r:hover{background:rgba(255,51,85,.07);}
.btn:disabled{opacity:.30;cursor:default;}
#queue-empty{font-size:10px;color:rgba(0,212,255,.25);letter-spacing:.08em;padding:5px 1px;display:none;}

#rcpt-strip{
  display:flex;align-items:center;gap:14px;margin-top:9px;padding-top:7px;
  border-top:1px solid rgba(0,212,255,.06);
  font-size:8px;color:rgba(0,212,255,.28);letter-spacing:.10em;
}
.rcpt-dot{width:5px;height:5px;border-radius:50%;background:#ffaa00;flex-shrink:0;}
.rcpt-dot.firing{animation:rcpt-fire .7s ease-out forwards;}
@keyframes rcpt-fire{0%{background:#ffaa00;box-shadow:0 0 10px #ffaa00;transform:scale(2);}100%{background:rgba(255,170,0,.25);box-shadow:none;transform:scale(1);}}
#rcpt-auth{margin-left:auto;color:rgba(0,212,255,.12);}

/* ── ORBIT ─────────────────────────────────────────────────────────────── */
#orbit-wrap{flex:1 1 auto;position:relative;overflow:hidden;}
canvas{position:absolute;inset:0;width:100%;height:100%;}
#nav{position:absolute;bottom:14px;right:18px;z-index:20;display:flex;gap:8px;}
#nav a{
  font-family:'Courier New',monospace;font-size:8px;letter-spacing:.14em;
  color:rgba(0,212,255,.32);text-decoration:none;
  border:1px solid rgba(0,212,255,.12);padding:4px 10px;
  transition:color .15s,border-color .15s;
}
#nav a:hover{color:#00d4ff;border-color:rgba(0,212,255,.38);}
</style>
</head>
<body>

<div id="brief">
  <div id="brief-head">
    <span id="brief-title">HELEN OS · HOME</span>
    <span id="brief-ts"></span>
  </div>
  <div id="mode-row">
    <span id="mode-label">OPERATOR STATE</span>
    <button class="mode-btn active" id="btn-focus" onclick="setMode('focus')">FOCUS</button>
    <button class="mode-btn" id="btn-witness" onclick="setMode('witness')">WITNESS</button>
  </div>
  <div id="helen-brief-line">HELEN was working. Here is what she found.</div>
  <div id="debt-row">
    <div id="debt-dot"></div>
    <span id="debt-label">2 unreceipted events · governance debt</span>
  </div>
  <div id="queue">
    <div id="queue-empty">All clear. HELEN is watching. No pending decisions.</div>
  </div>
  <div id="rcpt-strip">
    <div class="rcpt-dot" id="rcpt-dot"></div>
    <span id="rcpt-count">0 receipts this session</span>
    <span id="rcpt-last">no receipt yet</span>
    <span id="rcpt-auth">authority: false · witness-first · NO_RECEIPT = NO_CLAIM</span>
  </div>
</div>

<div id="orbit-wrap">
  <canvas id="c"></canvas>
  <div id="nav">
    <a href="temple.html">→ COCKPIT</a>
  </div>
</div>

<script>
'use strict';

let operatorMode='focus';
let debtCount=2;
let rcptCount=0;
let badges={};

function updateTs(){
  const n=new Date();
  document.getElementById('brief-ts').textContent=
    n.toISOString().slice(0,10)+' · '+n.toTimeString().slice(0,8);
}
updateTs();setInterval(updateTs,1000);

function setMode(m){
  operatorMode=m;
  document.getElementById('btn-focus').classList.toggle('active',m==='focus');
  document.getElementById('btn-witness').classList.toggle('active',m==='witness');
}

function fireReceipt(brief,src){
  const ts=new Date();
  const id='RCPT-'+(4096+rcptCount).toString(16).toUpperCase();
  rcptCount++;
  if(debtCount>0){debtCount--;updateDebt();}
  document.getElementById('rcpt-count').textContent=rcptCount+' receipt'+(rcptCount===1?'':'s')+' this session';
  document.getElementById('rcpt-last').textContent='last: '+ts.toTimeString().slice(0,8)+' · '+id+' · '+src;
  const dot=document.getElementById('rcpt-dot');
  dot.classList.remove('firing');void dot.offsetWidth;dot.classList.add('firing');
}

function updateDebt(){
  const dot=document.getElementById('debt-dot');
  const lbl=document.getElementById('debt-label');
  if(debtCount===0){
    dot.classList.add('zero');lbl.classList.add('zero');
    lbl.textContent='0 unreceipted events · governance clear';
  } else {
    dot.classList.remove('zero');lbl.classList.remove('zero');
    lbl.textContent=debtCount+' unreceipted event'+(debtCount===1?'':'s')+' · governance debt';
  }
}

function makeQItem(id,brief,src){
  const el=document.createElement('div');
  el.className='q-item';el.id='qi-'+id;
  el.innerHTML=
    `<span class="q-bullet">▸</span>`+
    `<span class="q-brief">${brief}</span>`+
    `<span class="q-src">${src}</span>`+
    `<div class="q-btns">`+
      `<button class="btn btn-c">CONFIRM</button>`+
      `<button class="btn btn-r">REJECT</button>`+
    `</div>`;
  el.querySelector('.btn-c').onclick=()=>confirmItem(el,brief,src);
  el.querySelector('.btn-r').onclick=()=>rejectItem(el);
  return el;
}

function confirmItem(el,brief,src){
  fireReceipt(brief,src);
  el.classList.add('confirmed');
  el.querySelector('.q-bullet').textContent='✓';
  el.querySelectorAll('button').forEach(b=>b.disabled=true);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>{el.remove();checkEmpty();},300);},550);
}

function rejectItem(el){
  el.classList.add('rejected');
  el.querySelector('.q-bullet').textContent='×';
  el.querySelectorAll('button').forEach(b=>b.disabled=true);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>{el.remove();checkEmpty();},300);},380);
}

function checkEmpty(){
  if(!document.querySelector('.q-item'))
    document.getElementById('queue-empty').style.display='block';
}

function buildItems(b){
  const items=[];
  const loc=b.cn_local;
  if(loc&&loc.count>0)
    items.push({id:'local',brief:loc.count+' uncommitted file'+(loc.count===1?'':'s')+' · branch: '+(loc.sub||'main'),src:'GIT'});
  const gh=b.cn_github;
  if(gh&&gh.count>0)
    items.push({id:'github',brief:gh.count+' unpushed commit'+(gh.count===1?'':'s')+' · '+(gh.label||'origin/main'),src:'GITHUB'});
  const cal=b.cn_cal;
  if(cal&&cal.count>0)
    items.push({id:'cal',brief:'Upcoming: '+cal.label,src:'CALENDAR'});
  const sk=b.cn_files;
  if(sk&&sk.count>0)
    items.push({id:'skills',brief:sk.count+' skills indexed · no gate pending',src:'SKILLS'});
  items.push({id:'auto',brief:'AUTORESEARCH E12 shipped · E13 blocked — awaiting MAYOR countersign',src:'AUTORESEARCH'});
  items.push({id:'debt',brief:debtCount+' unreceipted event'+(debtCount===1?'':'s')+' detected since last session',src:'LEDGER'});
  return items;
}

function renderQueue(items){
  const q=document.getElementById('queue');
  q.querySelectorAll('.q-item').forEach(e=>e.remove());
  const empty=document.getElementById('queue-empty');
  if(!items.length){empty.style.display='block';return;}
  empty.style.display='none';
  items.forEach(item=>q.appendChild(makeQItem(item.id,item.brief,item.src)));
}

async function loadQueue(){
  try{
    const r=await fetch('http://localhost:7001/api/connectors',{signal:AbortSignal.timeout(1500)});
    if(r.ok)badges=await r.json();
  }catch{}
  renderQueue(buildItems(badges));
}
loadQueue();

// ── Canvas ─────────────────────────────────────────────────────────────────
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const dpr=window.devicePixelRatio||1;
let W,H,CX,CY,R;

function resize(){
  const wrap=document.getElementById('orbit-wrap');
  W=wrap.clientWidth*dpr;H=wrap.clientHeight*dpr;
  canvas.width=W;canvas.height=H;
  canvas.style.width=wrap.clientWidth+'px';
  canvas.style.height=wrap.clientHeight+'px';
  CX=W/2;CY=H/2;R=Math.min(W,H)*.34;
}
resize();window.addEventListener('resize',resize);

const RINGS=[
  {oR:.60,col:'#00d4ff',focusA:.09,witnessA:.09},
  {oR:.74,col:'#6a4fff',focusA:.09,witnessA:.025},
  {oR:.88,col:'#00d4ff',focusA:.025,witnessA:.09},
  {oR:1.02,col:'#00ff88',focusA:.025,witnessA:.09},
  {oR:1.16,col:'#ffaa00',focusA:.09,witnessA:.09},
  {oR:1.30,col:'#ff6a00',focusA:.025,witnessA:.025},
];

function hexRgb(hex){const n=parseInt(hex.replace('#',''),16);return[(n>>16)&255,(n>>8)&255,n&255];}

let t0=null;
function frame(t){
  if(!t0)t0=t;
  const e=(t-t0)*.0001;
  ctx.clearRect(0,0,W,H);

  ctx.fillStyle='rgba(0,212,255,.11)';
  [[.10,.20],[.87,.13],[.06,.74],[.92,.78],[.20,.92],[.80,.88],
   [.04,.46],[.96,.44],[.50,.04],[.50,.96],[.36,.14],[.66,.08],
   [.26,.52],[.74,.54],[.15,.58],[.85,.42]].forEach(([fx,fy])=>{
    ctx.beginPath();ctx.arc(W*fx,H*fy,1.1*dpr,0,Math.PI*2);ctx.fill();
  });

  ctx.setLineDash([]);
  [1.55,1.37,1.18,.98,.76,.56,.36,.18].forEach((f,i)=>{
    ctx.strokeStyle=`rgba(0,212,255,${.006+i*.0025})`;
    ctx.lineWidth=.3*dpr;
    ctx.beginPath();ctx.arc(CX,CY,R*f,0,Math.PI*2);ctx.stroke();
  });

  RINGS.forEach((ring,i)=>{
    const{r,g,b}=hexRgb(ring.col);
    const base=operatorMode==='focus'?ring.focusA:ring.witnessA;
    const pulse=base+.015*Math.sin(e*(i+1)*.9);
    ctx.strokeStyle=`rgba(${r},${g},${b},${pulse})`;
    ctx.lineWidth=(base>.05?.55:.28)*dpr;
    ctx.setLineDash([2*dpr,10*dpr]);
    ctx.beginPath();ctx.arc(CX,CY,R*ring.oR,0,Math.PI*2);ctx.stroke();
    ctx.setLineDash([]);
  });

  // governance debt → amber kernel pressure
  const di=Math.min(debtCount/5,1);
  const kp=.5+.5*Math.sin(e*2.4);
  const kA=.10+di*.22+kp*(di*.10+.04);
  const kRad=R*(.14+di*.06);
  const kg=ctx.createRadialGradient(CX,CY,0,CX,CY,kRad*2.2);
  kg.addColorStop(0,`rgba(255,170,0,${kA*1.8})`);
  kg.addColorStop(.45,`rgba(255,170,0,${kA*.7})`);
  kg.addColorStop(1,'rgba(255,170,0,0)');
  ctx.fillStyle=kg;
  ctx.beginPath();ctx.arc(CX,CY,kRad*2.2,0,Math.PI*2);ctx.fill();

  ctx.save();
  ctx.globalAlpha=.55+di*.25+kp*.10;
  ctx.fillStyle='#ffaa00';
  ctx.shadowBlur=(8+di*16+kp*8)*dpr;ctx.shadowColor='#ffaa00';
  ctx.beginPath();ctx.arc(CX,CY,3.5*dpr,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  ctx.globalAlpha=.28+di*.20+kp*.05;
  ctx.fillStyle='#ffaa00';
  ctx.font=`${7.5*dpr}px 'Courier New'`;
  ctx.textAlign='center';
  ctx.fillText('HELEN',CX,CY-9*dpr);
  if(debtCount>0){
    ctx.font=`bold ${6.5*dpr}px 'Courier New'`;
    ctx.fillStyle=`rgba(255,170,0,${.55+di*.35})`;
    ctx.fillText(debtCount+' unreceipted',CX,CY+6*dpr);
  } else {
    ctx.font=`${6*dpr}px 'Courier New'`;
    ctx.fillStyle='rgba(0,255,136,.38)';
    ctx.fillText('clear',CX,CY+6*dpr);
  }
  ctx.restore();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
