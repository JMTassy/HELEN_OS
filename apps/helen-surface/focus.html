<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HELEN OS — Focus</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f0ede6;
  --border:rgba(0,0,0,.07);
  --border-med:rgba(0,0,0,.12);
  --text:#1a1916;
  --text-dim:rgba(26,25,22,.52);
  --text-mute:rgba(26,25,22,.3);
  --gold:#b8860b;
  --gold-dim:rgba(184,134,11,.55);
  --helen:#0ea5e9;
  --ok:#16a34a;
  --warn:#d97706;
  --blocked:#dc2626;
  --sans:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
  --mono:'Courier New',Courier,monospace;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}

/* ── TOP BAR ── */
#top{position:fixed;top:0;left:0;right:0;z-index:20;background:rgba(240,237,230,.92);border-bottom:1px solid var(--border);backdrop-filter:blur(16px)}
#top-bar{display:flex;align-items:center;padding:0 24px;height:38px;gap:0}
.tb-brand{display:flex;align-items:center;gap:9px;margin-right:22px;cursor:pointer}
.tb-logo{width:22px;height:22px;flex-shrink:0}
.tb-name{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(26,25,22,.6);font-weight:400}
.tb-year{font-family:var(--mono);font-size:7.5px;color:var(--text-mute);margin-left:2px}
.tb-sep{width:1px;height:13px;background:var(--border-med);margin:0 14px;flex-shrink:0}
.tb-field{display:flex;flex-direction:column;gap:1px;margin-right:14px}
.tb-field-k{font-size:7.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-mute)}
.tb-field-v{font-size:11px;color:var(--text-dim)}
.tb-push{margin-left:auto;display:flex;align-items:center;gap:8px}
.tb-badge{font-family:var(--mono);font-size:7px;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:3px;border:1px solid;white-space:nowrap}
.tb-badge.mode{color:var(--gold-dim);border-color:rgba(184,134,11,.22)}
.tb-badge.presence{color:var(--helen);border-color:rgba(14,165,233,.22);display:flex;align-items:center;gap:4px}
.presence-dot{width:5px;height:5px;border-radius:50%;background:var(--helen);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
#tb-clock{font-family:var(--mono);font-size:10px;color:var(--text-mute);letter-spacing:.04em}
.back-link{font-size:10px;color:var(--text-mute);cursor:pointer;letter-spacing:.04em;padding:3px 10px;border-radius:4px;border:1px solid var(--border-med);transition:all .14s}
.back-link:hover{color:var(--text-dim);border-color:rgba(0,0,0,.2)}

/* ── STAGE ── */
#stage{position:fixed;inset:38px 0 72px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center}

/* ── SACRED GEOMETRY ── */
#geo-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:0}
.geo-str{animation:geoBreath 16s ease-in-out infinite}
@keyframes geoBreath{0%,100%{opacity:.07}50%{opacity:.16}}
.geo-slowrot{transform-origin:720px 450px;animation:geoRot 90s linear infinite}
.geo-slowrot-r{transform-origin:720px 450px;animation:geoRotR 72s linear infinite}
.geo-breathe{animation:geoBreath 8s ease-in-out infinite}
@keyframes geoRot{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes geoRotR{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}
.geo-hot{pointer-events:all;cursor:pointer}
.geo-dot{fill:#b8860b;opacity:.28;transition:opacity .2s}
.geo-dot-glow{fill:#b8860b;opacity:0;transition:opacity .2s}
.geo-ring{fill:none;stroke:#b8860b;stroke-width:1.2;opacity:0;transition:opacity .2s}
.geo-lbl{opacity:0;transition:opacity .2s;font-family:'Courier New',monospace;fill:#1a1916;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:11px}
.geo-sub{opacity:0;transition:opacity .2s;font-family:'Courier New',monospace;fill:rgba(26,25,22,.4);letter-spacing:.05em;font-size:8.5px}
.geo-hot:hover .geo-dot{opacity:.7}
.geo-hot:hover .geo-dot-glow{opacity:.85}
.geo-hot:hover .geo-ring{opacity:.6}
.geo-hot:hover .geo-lbl{opacity:1}
.geo-hot:hover .geo-sub{opacity:1}
.geo-hot.active .geo-dot{opacity:.85}
.geo-hot.active .geo-dot-glow{opacity:.4}

/* ── CENTER CONTENT ── */
#center{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;max-width:560px;padding:0 24px}

#mark-wrap{margin-bottom:28px;position:relative}
#mark-wrap svg{width:52px;height:52px;animation:breathe 9s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.9;transform:scale(1.04)}}
#mark-ring{position:absolute;inset:-12px;border-radius:50%;border:1px solid rgba(184,134,11,.15);animation:ringPulse 9s ease-in-out infinite}
@keyframes ringPulse{0%,100%{opacity:0;transform:scale(.92)}50%{opacity:1;transform:scale(1)}}

.v-eyebrow{font-family:var(--mono);font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:14px}
.v-sit{font-size:13px;color:var(--text-dim);line-height:1.55;margin-bottom:18px}
.v-action{font-size:28px;font-weight:300;color:var(--text);line-height:1.2;margin-bottom:8px;letter-spacing:-.03em}
.v-sub{font-size:13px;color:var(--text-dim);line-height:1.5;margin-bottom:26px}

/* Status counters */
.status-row{display:flex;gap:0;border:1px solid var(--border-med);border-radius:10px;overflow:hidden;margin-bottom:28px;background:rgba(255,255,255,.55)}
.sr{padding:10px 22px;text-align:center;border-right:1px solid var(--border);cursor:default}
.sr:last-child{border-right:none}
.sr-n{font-family:var(--mono);font-size:18px;font-weight:300;line-height:1;margin-bottom:3px}
.sr-l{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-mute)}
.sr-n.prog{color:var(--helen)}
.sr-n.todo{color:var(--text-dim)}
.sr-n.wait{color:var(--warn)}
.sr-n.block{color:var(--blocked)}

/* ── BOTTOM ── */
#bottom{position:fixed;bottom:0;left:0;right:0;height:72px;background:rgba(240,237,230,.94);border-top:1px solid var(--border);backdrop-filter:blur(16px);display:flex;align-items:center;padding:0 24px;gap:10px}
#helen-input{flex:1;background:rgba(0,0,0,.04);border:1px solid var(--border-med);border-radius:8px;padding:0 16px;height:38px;font-family:var(--sans);font-size:12px;color:var(--text);outline:none;transition:border-color .14s}
#helen-input:focus{border-color:rgba(184,134,11,.35);background:rgba(255,255,255,.7)}
#helen-input::placeholder{color:var(--text-mute)}
.send-btn{height:38px;padding:0 18px;border-radius:8px;background:rgba(184,134,11,.1);border:1px solid rgba(184,134,11,.2);color:var(--gold);font-family:var(--sans);font-size:11px;cursor:pointer;transition:all .14s;white-space:nowrap;letter-spacing:.01em}
.send-btn:hover{background:rgba(184,134,11,.18);border-color:rgba(184,134,11,.35)}

/* ── TOAST ── */
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--text);color:rgba(255,252,246,.9);border-radius:8px;padding:9px 20px;font-size:11.5px;display:none;pointer-events:none;white-space:nowrap;box-shadow:0 4px 24px rgba(0,0,0,.18);z-index:40;letter-spacing:-.01em}
#toast.on{display:block;animation:tIn .15s ease}
@keyframes tIn{from{opacity:0;transform:translateX(-50%) translateY(5px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>

<script>
function sendCmd(){
  const inp=document.getElementById('helen-input');
  const val=inp.value.trim();if(!val)return;
  inp.value='';
  const key=val.toLowerCase().split(' ')[0];
  if(['play','music','spotify'].includes(key)){window.open('https://open.spotify.com','_blank','noopener');return}
  if(key==='pilot'||key==='starship'){window.location.href='starship.html';return}
  if(key==='cockpit'){window.location.href='index.html';return}
  if(key==='home'||key==='back'){window.location.href='helen2027.html';return}
  const r={
    next:'Next: Review helen2027.html — rate it, commit or revise.',
    status:'2 in progress · 3 to do · 1 blocked (E13) · 3 waiting.',
    blocked:'E13 blocked — countersign E11/E12 first.',
    focus:'You are in Focus mode. One thing: review the HOME surface.',
    help:'Commands: next · status · blocked · focus · home · pilot · cockpit',
  };
  toast('HELEN → '+(r[key]||'Commands: next · status · focus · home · pilot · cockpit'));
}
function updateClock(){
  const n=new Date();
  document.getElementById('tb-clock').textContent=n.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
updateClock();setInterval(updateClock,1000);
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('on');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),3500);
}
</script>
