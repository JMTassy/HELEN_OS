<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DREAM OF CONQUEST • The Rain (1mm macro storm)</title>
<style>
  body { margin:0; overflow:hidden; background:#000; color:#ddd; font-family:monospace; }
  canvas { display:block; }
  #ui { position:absolute; top:8px; left:8px; z-index:10; background:rgba(0,0,0,0.7); padding:6px 10px; border:1px solid #444; font-size:11px; }
  #ui button { background:#222; color:#0f0; border:1px solid #0a0; margin:1px; padding:1px 4px; cursor:pointer; font-size:10px; }
  #ui button:hover { background:#333; }
  #status { margin-top:4px; color:#0f0; }
  .small { font-size:9px; opacity:0.6; }
</style>
</head>
<body>
<div id="ui">
  DREAM OF CONQUEST — THE RAIN (ant-high, macro, time-dilated)<br>
  <button onclick="setPreset(0)">Plateau</button>
  <button onclick="setPreset(1)">Drop Close</button>
  <button onclick="setPreset(2)">Crown</button>
  <button onclick="setPreset(3)">Dew Lenses</button>
  <button onclick="setPreset(4)">Petal Ants</button>
  <button onclick="setPreset(5)">Puddle</button>
  <button onclick="setPreset(6)">Sun Break</button><br>
  <label>Phase <input type="range" id="phase" min="0" max="1" step="0.01" value="0.2" oninput="stormPhase=parseFloat(this.value)"></label>
  <label>Time <input type="range" id="ts" min="0.05" max="0.5" step="0.05" value="0.1" oninput="timeScale=parseFloat(this.value)"></label>
  <button onclick="creaturesActive=!creaturesActive">Creatures</button>
  <div id="status" class="small">macro time • rain active • garden only • CONQUEST simulation</div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let timeScale = 0.1;
let stormPhase = 0.2;
let creaturesActive = true;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a1a0a, 6, 28);

const camera = new THREE.PerspectiveCamera(62, window.innerWidth/window.innerHeight, 0.02, 80);
camera.position.set(0.4, 0.55, 2.2);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.1;
controls.minDistance = 0.2;
controls.maxDistance = 22;

// Lights — bright rain light, backlit
const hemi = new THREE.HemisphereLight(0x99bbff, 0x112200, 0.55);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2cc, 1.15);
sun.position.set(5, 14, -8);
scene.add(sun);

// ===== LEAF PLATEAU (CONQUEST Terrarium) =====
const leafSize = 11;
const leafSeg = 80;
const leafGeo = new THREE.PlaneGeometry(leafSize, leafSize, leafSeg, leafSeg);
const leafMat = new THREE.MeshPhongMaterial({color:0x1f4a1f, shininess:10, specular:0x0a220a});
const leaf = new THREE.Mesh(leafGeo, leafMat);
leaf.rotation.x = -Math.PI/2;
scene.add(leaf);

// Procedural veins + cells + slight curl
function buildLeaf() {
  const p = leafGeo.attributes.position;
  for (let i=0; i<p.count; i++) {
    let x = p.getX(i), z = p.getZ(i);
    let h = Math.sin(x*1.7)*0.07 + Math.sin(z*2.1)*0.05;
    h += (Math.sin(x*11 + z*7)*0.011 + Math.sin(x*17+z*13)*0.007);
    const d = Math.sqrt(x*x+z*z);
    if (d > 4.2) h -= (d-4.2)*0.55;
    p.setY(i, h);
  }
  p.needsUpdate = true;
  leafGeo.computeVertexNormals();
}
buildLeaf();

// ===== GRASS TOWERS (Canyon) =====
const grassCount = 180;
const gGeo = new THREE.PlaneGeometry(0.09, 4.2, 1, 4);
const gMat = new THREE.MeshPhongMaterial({color:0x163a16, side:THREE.DoubleSide, shininess:3});
const grasses = new THREE.InstancedMesh(gGeo, gMat, grassCount);
const tmp = new THREE.Object3D();
for (let i=0; i<grassCount; i++) {
  const a = i/ grassCount * Math.PI*2 + (Math.random()-0.5)*0.3;
  const r = 5.2 + Math.random()*4.5;
  tmp.position.set(Math.cos(a)*r, 2.1 + Math.random()*1.8, Math.sin(a)*r);
  tmp.rotation.y = a + (Math.random()-0.5)*0.5;
  tmp.scale.set(1+Math.random()*0.7, 1+Math.random()*0.9, 1);
  tmp.updateMatrix();
  grasses.setMatrixAt(i, tmp.matrix);
}
grasses.instanceMatrix.needsUpdate = true;
scene.add(grasses);

// ===== INSTANCED RAINDROPS (exercise-ball size) =====
const N_DROPS = 95;
const dropGeo = new THREE.SphereGeometry(0.21, 10, 10);
const dropMat = new THREE.MeshPhongMaterial({color:0xaaccff, transparent:true, opacity:0.58, shininess:85, specular:0xffffff});
const drops = new THREE.InstancedMesh(dropGeo, dropMat, N_DROPS);
scene.add(drops);
const dropStates = [];
for (let i=0; i<N_DROPS; i++) {
  dropStates.push({
    x: (Math.random()-0.5)*11,
    y: 5 + Math.random()*8,
    z: (Math.random()-0.5)*11,
    vy: 1.8 + Math.random()*0.9,
    w: Math.random()*Math.PI*2,
    s: 0.15 + Math.random()*0.08
  });
}

let crowns = [];
function spawnCrown(x,y,z,s=1) {
  const cGeo = new THREE.CylinderGeometry(s*0.95, s*0.18, s*0.55, 8, 1, true);
  const cMat = new THREE.MeshPhongMaterial({color:0xbbddff, transparent:true, opacity:0.8, side:THREE.DoubleSide, shininess:95});
  const c = new THREE.Mesh(cGeo, cMat);
  c.position.set(x,y+0.08,z);
  c.userData = {t:0, life:1.8, maxLife:1.8};
  scene.add(c);
  crowns.push(c);
  // splash droplets
  for (let k=0; k<6; k++) {
    const sd = new THREE.Mesh(new THREE.SphereGeometry(0.035+Math.random()*0.03, 5,5), dropMat);
    sd.position.set(x+(Math.random()-0.5)*0.4, y+0.25, z+(Math.random()-0.5)*0.4);
    sd.userData = {t:0, life:0.9+Math.random()*0.5, vx:(Math.random()-0.5)*2.2, vy:1.1+Math.random()*0.6, vz:(Math.random()-0.5)*2.2};
    scene.add(sd);
    crowns.push(sd);
  }
}

function updateDrops(dt) {
  const mat = drops.instanceMatrix;
  for (let i=0; i<N_DROPS; i++) {
    const d = dropStates[i];
    d.y -= d.vy * dt * timeScale;
    d.w += dt * 4.5;
    const wx = Math.sin(d.w)*0.025;
    const wz = Math.cos(d.w*0.7)*0.02;
    if (d.y < 0.12) {
      spawnCrown(d.x+wx, 0.1, d.z+wz, d.s*1.1);
      // rolling dome chance
      if (Math.random() < 0.55) spawnDome(d.x, 0.18, d.z, d.s*1.3);
      d.y = 5 + Math.random()*7;
      d.x = (Math.random()-0.5)*10;
      d.z = (Math.random()-0.5)*10;
      d.vy = 1.7 + Math.random()*0.8;
    }
    tmp.position.set(d.x+wx, d.y, d.z+wz);
    tmp.scale.setScalar(d.s);
    tmp.updateMatrix();
    mat.setMatrixAt(i, tmp.matrix);
  }
  mat.needsUpdate = true;
}

// ===== CROWNS + SPLASH DROPLETS =====
function updateCrowns(dt) {
  for (let i=crowns.length-1; i>=0; i--) {
    const c = crowns[i];
    if (!c.userData.t && !c.userData.life) { c.position.y += 0.01; continue; }
    if (c.userData.life) {
      c.userData.life -= dt * timeScale * 0.85;
      const t = c.userData.life / c.userData.maxLife || 0;
      c.scale.setScalar(Math.max(0.05, t));
      if (c.userData.vx) {
        c.position.x += c.userData.vx * dt * timeScale * 0.5;
        c.position.z += c.userData.vz * dt * timeScale * 0.5;
        c.position.y += c.userData.vy * dt * timeScale;
        c.userData.vy -= 2.6 * dt * timeScale;
      }
    } else {
      c.userData.t = (c.userData.t||0) + dt * timeScale;
      const t = c.userData.t / 1.7;
      c.scale.setScalar(1 - t*0.9);
    }
    if ((c.userData.life||0) <= 0 && (c.userData.t||0) > 1.7) {
      scene.remove(c);
      crowns.splice(i,1);
    }
  }
}

// ===== ROLLING DOMES =====
let domes = [];
function spawnDome(x,y,z,s=0.32) {
  const dGeo = new THREE.SphereGeometry(s, 9, 9);
  const dMat = new THREE.MeshPhongMaterial({color:0xaaddff, transparent:true, opacity:0.7, shininess:65});
  const d = new THREE.Mesh(dGeo, dMat);
  d.position.set(x,y,z);
  d.userData = {vx:(Math.random()-0.5)*0.9, vz:(Math.random()-0.5)*0.9, s, life:8+Math.random()*3, w:Math.random()*10};
  scene.add(d);
  domes.push(d);
}

function updateDomes(dt) {
  for (let i=domes.length-1; i>=0; i--) {
    const d = domes[i];
    const u = d.userData;
    u.w += dt*3.2;
    d.position.x += u.vx * dt * timeScale;
    d.position.z += u.vz * dt * timeScale;
    const h = Math.max(0, 0.1 - Math.sqrt(d.position.x*d.position.x + d.position.z*d.position.z)*0.016);
    d.position.y = h + u.s * (0.55 + Math.sin(u.w)*0.07);
    u.s = Math.min(0.55, u.s + 0.0015); // grow by consuming
    u.life -= dt * timeScale * 0.35;
    if (u.life < 0 || Math.abs(d.position.x)>6 || Math.abs(d.position.z)>6) {
      scene.remove(d);
      domes.splice(i,1);
    }
  }
}

// ===== DEW LENSES (refracting) =====
const dew = new THREE.Group();
scene.add(dew);
for (let i=0; i<9; i++) {
  const s = 0.065 + Math.sin(i)*0.015;
  const m = new THREE.Mesh(new THREE.SphereGeometry(s,7,7), new THREE.MeshPhongMaterial({color:0xaaddff, transparent:true, opacity:0.5, shininess:98}));
  m.position.set(-1.2 + i*0.26, 1.95 + Math.sin(i*0.6)*0.35, 1.65);
  dew.add(m);
}

// ===== PETAL PAVILION + ANTS (goblins) =====
const petalGeo = new THREE.PlaneGeometry(2.4, 1.4, 6, 3);
const petal = new THREE.Mesh(petalGeo, new THREE.MeshPhongMaterial({color:0xbb6644, side:THREE.DoubleSide, shininess:15}));
petal.rotation.set(1.55, 0.7, 0.35);
petal.position.set(-2.9, 0.28, -1.6);
scene.add(petal);

const ants = [];
for (let i=0; i<4; i++) {
  const ant = new THREE.Mesh(new THREE.CapsuleGeometry(0.025, 0.07, 2), new THREE.MeshPhongMaterial({color:0x111111}));
  ant.position.set(-3.4 + i*0.15, 0.15, -1.95 + (i%2)*0.08);
  scene.add(ant);
  ants.push(ant);
}

// ===== BUMBLEBEE (furred airship) =====
const bee = new THREE.Group();
bee.add(new THREE.Mesh(new THREE.SphereGeometry(0.19, 7,5), new THREE.MeshPhongMaterial({color:0x221100})));
const stripe = new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,0.06,6), new THREE.MeshPhongMaterial({color:0xffcc44}));
stripe.rotation.z = Math.PI/2;
bee.add(stripe);
const w1 = new THREE.Mesh(new THREE.PlaneGeometry(0.55,0.15), new THREE.MeshPhongMaterial({color:0x88aaff, transparent:true, opacity:0.45, side:THREE.DoubleSide}));
w1.position.set(0,0.12,0.08);
bee.add(w1);
const w2 = w1.clone(); w2.position.z = -0.08; bee.add(w2);
bee.position.set(1.5, 3.8, -3.2);
scene.add(bee);

// ===== PUDDLE + RINGS =====
const puddle = new THREE.Mesh(new THREE.CircleGeometry(1.9,28), new THREE.MeshPhongMaterial({color:0x0a2233, transparent:true, opacity:0.55, shininess:50}));
puddle.rotation.x = -Math.PI/2;
puddle.position.set(1.2, 0.015, -3.8);
scene.add(puddle);
const ringMeshes = [];
for (let r=0; r<3; r++) {
  const rg = new THREE.Mesh(new THREE.RingGeometry(0.25+r*0.35, 0.28+r*0.35, 22), new THREE.MeshBasicMaterial({color:0x77aaff, transparent:true, opacity:0.2, side:THREE.DoubleSide}));
  rg.rotation.x = -Math.PI/2;
  rg.position.copy(puddle.position);
  rg.position.y += 0.008;
  scene.add(rg);
  ringMeshes.push({m:rg, ph:r*1.1});
}

// ===== SUN SHAFTS =====
for (let s=0; s<4; s++) {
  const sh = new THREE.Mesh(new THREE.PlaneGeometry(2.8,14), new THREE.MeshBasicMaterial({color:0xffee99, transparent:true, opacity:0.09, side:THREE.DoubleSide, depthWrite:false}));
  sh.position.set(-1.5+s*1.2, 4.5, -2 + (s%2));
  sh.rotation.set(0.7, 0.15+s*0.12, 0);
  scene.add(sh);
}

// ===== LEAF FLEX (impact waves) =====
function flexLeaf(intensity) {
  const p = leafGeo.attributes.position;
  for (let i=0; i<p.count; i++) {
    const x = p.getX(i), z = p.getZ(i);
    const wave = Math.sin(globalTime*2.2 + x*1.3 + z*0.9) * intensity * 0.018;
    p.setY(i, p.getY(i) + wave);
  }
  p.needsUpdate = true;
}

let globalTime = 0;
let lastImpact = 0;
let ringMeshes = [];

function animate() {
  const dt = 0.016;
  globalTime += dt;

  const phase = (globalTime * 0.035 + stormPhase) % 1;
  const rainInt = (phase < 0.35) ? 1.0 : (phase < 0.55 ? 2.4 : (phase < 0.72 ? 0.35 : 0.18));

  // Rain
  updateDrops(dt);

  // Crowns & domes
  updateCrowns(dt);
  updateDomes(dt);

  // Bee patrol (thundering overhead)
  const bt = globalTime * 0.35;
  bee.position.x = Math.sin(bt)*4.8;
  bee.position.z = Math.cos(bt*0.6)*2.8 -1;
  bee.position.y = 3.6 + Math.sin(bt*1.1)*0.7;
  bee.rotation.y = bt*0.55 + 2.2;
  if (bee.children[2]) bee.children[2].rotation.z = Math.sin(bt*26) * 0.9;
  if (bee.children[3]) bee.children[3].rotation.z = -Math.sin(bt*26) * 0.9;

  // Ants
  if (creaturesActive && typeof ants !== 'undefined') ants.forEach((a,i) => {
    a.position.x += Math.sin(globalTime*0.4 + i)*0.0008;
    a.position.z = -1.95 + Math.sin(globalTime*0.3 + i*2)*0.03;
  });

  // Leaf flex on "impacts"
  const impact = (globalTime - lastImpact) < 0.8 ? 1 : 0;
  flexLeaf(impact * 0.8 * rainInt);

  // Puddle rings
  if (typeof ringMeshes !== 'undefined') ringMeshes.forEach((r, i) => {
    const t = (globalTime*1.6 + r.ph) % (Math.PI*1.6);
    if (r.m) {
      r.m.scale.setScalar(0.5 + Math.sin(t)*0.4);
      r.m.material.opacity = 0.1 + Math.cos(t)*0.08;
    }
  });

  // Dew tremble
  if (typeof dew !== 'undefined' && dew.children) dew.children.forEach((d,i) => d.scale.setScalar(1 + Math.sin(globalTime*2.4+i)*0.035));

  // Gentle camera bob on leaf
  if (!controls.enabled) {
    camera.position.y += Math.sin(globalTime*1.6)*0.0004;
  }

  controls.update();
  renderer.render(scene, camera);
}

function loop() {
  requestAnimationFrame(loop);
  animate();
}

window.setPreset = (i) => {
  const ps = [
    [0.3, 2.1, 0.2],   // plateau
    [0.9, 0.9, 0.55],  // drop
    [-0.6, 0.6, 0.6],  // crown
    [-1.3, 1.9, 0.7],  // dew
    [-2.8, 0.25, 0.25],// ants
    [1.4, -3.6, 0.8],  // puddle
    [0.1, 2.8, 0.6]    // sun
  ];
  const p = ps[i];
  camera.position.set(p[0], 0.9, p[1]);
  camera.lookAt(0, 0.15, 0);
  stormPhase = p[2];
  document.getElementById('phase').value = stormPhase;
};

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

renderer.domElement.addEventListener('click', () => renderer.domElement.requestPointerLock?.());

let keys = {};
addEventListener('keydown', e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup', e=>keys[e.key.toLowerCase()]=false);

function flyCam(dt) {
  const sp = 2.8 * (keys['shift']?2:1) * timeScale;
  const f = new THREE.Vector3(); camera.getWorldDirection(f);
  const r = new THREE.Vector3().crossVectors(f, camera.up).normalize();
  if (keys['w']) camera.position.addScaledVector(f, sp*dt);
  if (keys['s']) camera.position.addScaledVector(f, -sp*dt);
  if (keys['a']) camera.position.addScaledVector(r, -sp*dt);
  if (keys['d']) camera.position.addScaledVector(r, sp*dt);
  if (keys[' ']) camera.position.y += sp*dt*0.7;
  if (keys['c']) camera.position.y -= sp*dt*0.7;
}

function loop() {
  requestAnimationFrame(loop);
  const dt = 0.016;
  flyCam(dt);
  animate();
  // simple rain intensity visual (spawn nudge)
  if (Math.random() < 0.12 * (stormPhase<0.35?1:1.8)) {
    const idx = Math.floor(Math.random()*dropStates.length);
    if (dropStates[idx]) dropStates[idx].y -= 1.2;
  }
}

setPreset(0);
loop();
console.log('%c[DREAM OF CONQUEST] 1mm rainstorm ready — procedural, import-mapped Three.js', 'color:#0f0');
</script>
</body>
</html>
