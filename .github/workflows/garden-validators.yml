name: garden-validators

on:
  push:
    branches: [main]
    paths:
      - "temple/gardens/**"
      - "scripts/ci_garden_validators.sh"
  pull_request:
    branches: [main]
    paths:
      - "temple/gardens/**"
      - "scripts/ci_garden_validators.sh"

jobs:
  garden-validators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run all temple garden validators (fail closed on ok:false)
        run: bash scripts/ci_garden_validators.sh
