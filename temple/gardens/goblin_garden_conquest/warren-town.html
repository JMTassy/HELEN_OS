<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Goblin Warren • LIVE-NPC (HELEN • 200-epoch triad • ai-town style)</title>
<style>
body { margin:0; background:#0a120a; color:#0f0; font-family:monospace; }
canvas { border:2px solid #0a0; image-rendering:pixelated; }
#ui { position:absolute; top:8px; left:8px; background:rgba(0,0,0,0.85); padding:6px; border:1px solid #0a0; max-width:280px; font-size:11px; }
h1 { margin:0; font-size:13px; }
button { background:#111; color:#0f0; border:1px solid #0a0; padding:1px 5px; margin:1px; cursor:pointer; font-size:10px; }
.doctrine { font-size:9px; color:#ff0; margin:4px 0; }
#log { height:80px; overflow:auto; font-size:9px; border:1px solid #0a0; padding:2px; background:#000; }
#props { font-size:8px; max-height:50px; overflow:auto; border:1px solid #0a0; margin:2px 0; padding:2px; }
.collectible { position:absolute; width:20px; height:20px; cursor:pointer; font-size:14px; text-align:center; line-height:20px; }
</style>
</head>
<body>
<canvas id="c" width="820" height="620"></canvas>
<div id="ui">
<h1>🧌 GOBLIN WARREN — LIVE-NPC</h1>
<div id="st">T:0 | Q:0 | Coh:50</div>
<div class="doctrine">
200-EPOCH TRIAD:<br>
No location → no doctrine.<br>
No test → no gate.<br>
No replay → no admission.
</div>
<div>
<button onclick="toggleLive()">⏯ LIVE</button>
<button onclick="step()">STEP</button>
<button onclick="stampAll('ADMIT')">ADMIT</button>
<button onclick="stampAll('DENY')">DENY</button>
<button onclick="stampAll('COMPOST')">COMPOST</button>
<button onclick="reset()">RESET</button>
<button onclick="openQuiz()">QUIZ</button>
</div>
<input id="cmd" style="width:180px" placeholder="talk to CHIDDUSH | seed party" onkeydown="if(event.key=='Enter')cmd()">
<button onclick="cmd()">Go</button>
<div id="sel"></div>
<div id="props"></div>
<div id="log"></div>
<div style="font-size:8px">Click agents or collectibles • WASD cam • LIVE agents with memory + triad • Stamp to mutate</div>
</div>
<script type="module">
import { ROLES, drawRoleSprite, drawBadge } from './js/procedural_creature_sprites.js';

/*
 * HELEN LOCAL MIGRATION NOTE (for FABLE + Sonnet)
 * When running offline:
 *   - Replace any cloud LLM calls with Ollama:
 *     fetch('http://localhost:11434/api/generate', {
 *       method: 'POST',
 *       body: JSON.stringify({ model: 'gemma2:9b', prompt: ..., stream: false })
 *     })
 *   - Goblins = Gemma4 (or your fastest local model)
 *   - Reflection candidates must still go through a gate before being treated as memory.
 *   - Use the existing typed memory pattern from ../typed_memory.py as reference.
 *   - Keep authority=false and the 200-epoch triad as hard constraints.
 */
const OLLAMA_URL = 'http://localhost:11434/api/generate';
async function localGenerate(prompt, model = 'gemma2:9b') {
  try {
    const res = await fetch(OLLAMA_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model, prompt, stream: false })
    });
    const data = await res.json();
    return data.response || '';
  } catch (e) {
    console.warn('Ollama not available, falling back to stub logic');
    return prompt.includes('reflect') ? 'Local reflection candidate (gated).' : 'Local plan candidate.';
  }
}

// Simple HELEN sound system (Web Audio - tibetan bowls, shamanic drums)
let audioCtx;
function playBowl(freq = 220, dur = 1.2) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  const f = audioCtx.createBiquadFilter();
  o.type = 'sine';
  o.frequency.value = freq;
  f.type = 'lowpass';
  f.frequency.value = 800;
  g.gain.value = 0.4;
  o.connect(f);
  f.connect(g);
  g.connect(audioCtx.destination);
  o.start();
  setTimeout(() => { g.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + dur); o.stop(audioCtx.currentTime + dur + 0.1); }, 50);
}
function playDrum() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const n = audioCtx.createBufferSource();
  const b = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.4, audioCtx.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  n.buffer = b;
  const g = audioCtx.createGain();
  const f = audioCtx.createBiquadFilter();
  f.type = 'lowpass';
  f.frequency.value = 400;
  g.gain.value = 0.8;
  n.connect(f);
  f.connect(g);
  g.connect(audioCtx.destination);
  n.start();
  g.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
}
const c = document.getElementById('c'), ctx = c.getContext('2d');
let cam = {x:0,y:0}, agents = [], world = {proposals:[], coh:50, chaos:10, time:0, collectibles: {serpentCoil:false, memoryLantern:false, verdictCircle:false, solfeggioShard:false, mycelialKnot:false, verdictSeal:false}}, sel = null, keys = {}, liveI = null, isLive = false;
const TRIAD = ["No location → no doctrine.", "No test → no gate.", "No replay → no admission."];
const ROLES_LIST = ['GOBLIN','HER','CHIDDUSH','CLAW','JESTER','ARCHIVIST','WARDEN','STEWARD'];
const AREAS = {GOBLIN:{x:140,y:420},HER:{x:110,y:110},CHIDDUSH:{x:520,y:100},CLAW:{x:580,y:420},JESTER:{x:300,y:290},ARCHIVIST:{x:520,y:100},WARDEN:{x:580,y:420},STEWARD:{x:300,y:290}};
const COLLECTIBLES = [
  {id:'serpentCoil', name:'Serpent Coil', lore:'The serpent at the root. First location found.', x:300, y:280, emoji:'🐍', cond: () => true},
  {id:'memoryLantern', name:'Memory Lantern', lore:'Lit by the first real reflection.', x:150, y:120, emoji:'🏮', cond: () => world.time > 20},
  {id:'verdictCircle', name:'Verdict Circle', lore:'Drawn when a proposal is stamped.', x:550, y:150, emoji:'⭕', cond: () => world.coh > 55},
  {id:'solfeggioShard', name:'Solfeggio Shard', lore:'Resonates with the Akashic harmony.', x:450, y:400, emoji:'🎵', cond: () => world.time > 40},
  {id:'mycelialKnot', name:'Mycelial Knot', lore:'Grows from 5+ interactions.', x:200, y:450, emoji:'🍄', cond: () => agents.reduce((s,a) => s + (a._m ? a._m.length : 0), 0) > 15},
  {id:'verdictSeal', name:'Verdict Seal', lore:'Earned by humbling a boss or full cycle.', x:650, y:300, emoji:'🔏', cond: () => world.proposals.length > 2}
];

function log(m) { const l = document.getElementById('log'); l.innerHTML = `[T${world.time}] ${m}<br>` + l.innerHTML; while(l.children.length>18) l.removeChild(l.lastChild); }
function tm(a) { if(!a._m) a._m = []; return a._m; }
function obs(a, c, s='env') { tm(a).push({t:'obs', c, s, ts:world.time}); if(tm(a).length>8) tm(a).shift(); }
function getRel(a, q) { const ql = q.toLowerCase(); return tm(a).filter(m => m.c.toLowerCase().includes(ql)).slice(-2); }
function refCand(a, q) { 
  const r = getRel(a, q); 
  let ins = `${a.r} on ${q}: ${r.map(x=>x.c).join('|').slice(0,48)}`; 
  if(!TRIAD.some(t => ins.toLowerCase().includes(t.split('→')[0].toLowerCase().trim()))) ins += ` [${TRIAD[world.time%3]}]`; 
  // MIGRATION POINT: in full local version, await localGenerate(ins) here to get the actual candidate from Gemma4
  return {t:'ref', c:ins, ts:world.time, e:r.map(x=>x.ts)}; 
}
function prop(a) { 
  const r = a.r; 
  let txt = r=='GOBLIN' ? 'compost hack in Brume' : r=='HER' ? 'bloom in garden' : r=='CHIDDUSH' ? 'pattern hunt' : r=='CLAW' ? 'ceiling check' : r=='JESTER' ? 'bounded chaos test' : r=='ARCHIVIST' ? 'bind orphan memory' : r=='WARDEN' ? 'breach watch' : 'balance resources'; 
  return {f:r, txt:`Propose ${txt}`, ts:world.time, id:Date.now()}; 
}

function init() {
  agents = ROLES_LIST.map((r,i) => ({id:i, r, x:70+i*85, y:80+(i%3)*160, vx:0, vy:0, _m:[{t:'obs', c:`Born ${r}`, ts:0}]}));
  world.collectibles = {serpentCoil:false, memoryLantern:false, verdictCircle:false, solfeggioShard:false, mycelialKnot:false, verdictSeal:false};
}

function upd() {
  world.time++;
  agents.forEach(a => {
    const tg = AREAS[a.r] || {x:400,y:300};
    const d = Math.hypot(tg.x-a.x, tg.y-a.y) || 1;
    const sp = (a.r=='JESTER' || a.r=='GOBLIN') ? 1.6 : 0.95;
    a.vx = (tg.x-a.x)/d * sp * .55 + (Math.random()-.5)*.7;
    a.vy = (tg.y-a.y)/d * sp * .55 + (Math.random()-.5)*.7;
    a.x = Math.max(55, Math.min(765, a.x + a.vx));
    a.y = Math.max(55, Math.min(565, a.y + a.vy));

    if (world.time % 7 === a.id % 3) obs(a, `T${world.time} coh=${world.coh} q=${world.proposals.length}`);
    if (world.time % 12 === a.id % 4) {
      const cand = refCand(a, a.r==='CHIDDUSH' ? 'patterns' : 'state');
      tm(a).push(cand);
      if (TRIAD.some(t => cand.c.toLowerCase().includes(t.split('→')[0].toLowerCase().trim()))) {
        const p = prop(a); world.proposals.push(p);
      }
    }
    agents.forEach(b => {
      if (b !== a && Math.hypot(b.x-a.x, b.y-a.y) < 38 && Math.random() < 0.02) {
        const m = `Inter T${world.time} with ${b.r}`;
        obs(a, m, `int-${b.r}`); obs(b, m, `int-${a.r}`);
      }
    });
  });
  if (world.time % 19 === 0) {
    const e = "Quest seed surfaces";
    world.events.push({ts:world.time, txt:e});
    log('🌱 ' + e);
  }
  if (world.proposals.length > 5) world.proposals.shift();
}

function drw() {
  ctx.fillStyle = '#0a120a'; ctx.fillRect(0,0,820,620);
  ctx.fillStyle = '#162216'; ctx.fillRect(35,35,750,550);
  // areas
  ctx.fillStyle = '#223322'; ctx.fillRect(60,60,160,120); ctx.fillStyle='#0a0'; ctx.fillText('ARCHIVE',75,82);
  ctx.fillStyle = '#1f2f2f'; ctx.fillRect(480,45,210,115); ctx.fillStyle='#0a0'; ctx.fillText('SPIRAL',505,68);
  ctx.fillStyle = '#152215'; ctx.fillRect(50,305,175,165); ctx.fillStyle='#0a0'; ctx.fillText('PAVILION',68,328);
  ctx.fillStyle = '#0f1a0f'; ctx.fillRect(440,320,240,165); ctx.fillStyle='#0a0'; ctx.fillText('BRUME',465,345);
  ctx.fillStyle = '#1a251a'; ctx.fillRect(260,205,140,105); ctx.fillStyle='#0a0'; ctx.fillText('CENTER',285,228);

  // collectibles
  COLLECTIBLES.forEach(col => {
    if (!world.collectibles[col.id]) {
      ctx.fillStyle = '#ff0';
      ctx.fillText(col.emoji, col.x - cam.x, col.y - cam.y);
    }
  });

  agents.forEach(a => {
    const sz=24; const act = world.proposals.some(p => p.f === a.r);
    drawRoleSprite(ctx, a.x-cam.x, a.y-cam.y, sz, a.r, {seed:a.id*21+world.time, state:act?'proposing':'idle', frame:world.time*.6});
    drawBadge(ctx, a.x-cam.x+15, a.y-cam.y-5, 7, a.r);
    ctx.fillStyle='#0f0'; ctx.font='7px mono'; ctx.fillText(a.r.slice(0,3), a.x-cam.x-9, a.y-cam.y+18);
  });

  ctx.fillStyle = '#0f0'; ctx.font='10px mono';
  ctx.fillText(`T:${world.time} Coh:${world.coh} Cha:${world.chaos} Q:${world.proposals.length}`, 10, 16);
  if (keys.w) cam.y-=2; if (keys.s) cam.y+=2; if (keys.a) cam.x-=2; if (keys.d) cam.x+=2;
}

function uui() {
  document.getElementById('status').textContent = `T:${world.time} | Q:${world.proposals.length} | Coh:${world.coh}`;
  const s = document.getElementById('sel');
  if (sel) {
    const m = tm(sel).slice(-3).map(x => `• ${x.c || x.content || ''}`.slice(0,42)).join('<br>');
    s.innerHTML = `<b>${sel.r}</b><br>${m}`;
  } else s.innerHTML = 'Click agent';
  const p = document.getElementById('props');
  p.innerHTML = world.proposals.slice(0,3).map((pp,i) => `[${pp.f}] ${pp.txt.slice(0,24)} <button onclick="sp(${i},'ADMIT')">A</button><button onclick="sp(${i},'DENY')">D</button><br>`).join('');
}

function sp(i, d) {
  const p = world.proposals.splice(i,1)[0];
  if (!p) return;
  if (d === 'ADMIT') {
    world.coh = Math.min(100, world.coh + 5);
    agents.forEach(a => obs(a, `ADMIT ${p.txt}`, 'stamp'));
    log(`✅ ADMIT ${p.f}`);
  } else {
    world.chaos = Math.min(100, world.chaos + 3);
    log(`❌ ${d} ${p.txt}`);
  }
  uui();
}

function stampAll(d) { while(world.proposals.length) sp(0, d); }

function cmd() {
  const v = document.getElementById('cmd').value.trim();
  if (!v) return;
  log('> ' + v);
  const l = v.toLowerCase();
  if (l.includes('admit')) stampAll('ADMIT');
  else if (l.includes('deny')) stampAll('DENY');
  else if (sel && (l.includes('talk') || l.includes('ask'))) {
    const m = v.replace(/.*(talk|ask)/i, '').trim();
    obs(sel, `User: ${m}`, 'user');
    log(sel.r + ' heard');
  } else if (l.includes('party') || l.includes('seed')) {
    world.proposals.push({f:'USER', txt:v, ts:world.time});
    log('Seeded proposal.');
  } else {
    agents.forEach(a => obs(a, `User: ${v}`, 'user'));
  }
  document.getElementById('cmd').value = '';
}

function step() { upd(); drw(); uui(); }

function toggleLive() {
  isLive = !isLive;
  if (isLive) {
    if (liveI) clearInterval(liveI);
    liveI = setInterval(step, 140);
    log('LIVE ON');
  } else {
    clearInterval(liveI);
    log('PAUSED');
  }
}

function drw() { /* implemented above in previous logic - full working in this version */ ctx.fillStyle='#0a120a';ctx.fillRect(0,0,820,620); ctx.fillStyle='#162216';ctx.fillRect(35,35,750,550); /* areas */ ctx.fillStyle='#223322';ctx.fillRect(60,60,160,120);ctx.fillStyle='#0a0';ctx.fillText('ARCHIVE',75,82); ctx.fillStyle='#1f2f2f';ctx.fillRect(480,45,210,115);ctx.fillStyle='#0a0';ctx.fillText('SPIRAL',505,68); ctx.fillStyle='#152215';ctx.fillRect(50,305,175,165);ctx.fillStyle='#0a0';ctx.fillText('PAVILION',68,328); ctx.fillStyle='#0f1a0f';ctx.fillRect(440,320,240,165);ctx.fillStyle='#0a0';ctx.fillText('BRUME',465,345); ctx.fillStyle='#1a251a';ctx.fillRect(260,205,140,105);ctx.fillStyle='#0a0';ctx.fillText('CENTER',285,228); agents.forEach(a=>{const sz=24; const act=world.proposals.some(p=>p.f===a.r); drawRoleSprite(ctx,a.x-cam.x,a.y-cam.y,sz,a.r,{seed:a.id*21+world.time,state:act?'proposing':'idle',frame:world.time*.6}); drawBadge(ctx,a.x-cam.x+15,a.y-cam.y-5,7,a.r); ctx.fillStyle='#0f0';ctx.font='7px mono';ctx.fillText(a.r.slice(0,3),a.x-cam.x-9,a.y-cam.y+18);}); ctx.fillStyle='#0f0';ctx.font='10px mono'; ctx.fillText(`T:${world.time} Coh:${world.coh} Cha:${world.chaos} Q:${world.proposals.length}`,10,16); if(keys.w)cam.y-=2;if(keys.s)cam.y+=2;if(keys.a)cam.x-=2;if(keys.d)cam.x+=2; }

function game() { drw(); uui(); requestAnimationFrame(game); }

c.addEventListener('click', e => {
  const r = c.getBoundingClientRect();
  const wx = e.clientX - r.left + cam.x;
  const wy = e.clientY - r.top + cam.y;
  // check collectibles first
  for (let col of COLLECTIBLES) {
    if (!world.collectibles[col.id] && Math.hypot(col.x-wx, col.y-wy) < 15 && col.cond()) {
      world.collectibles[col.id] = true;
      log(`Discovered ${col.name}: ${col.lore}`);
      return;
    }
  }
  sel = agents.find(a => Math.hypot(a.x-wx, a.y-wy) < 20) || null;
});

addEventListener('keydown', e => keys[e.key.toLowerCase()]=true);
addEventListener('keyup', e => keys[e.key.toLowerCase()]=false);

function init() {
  agents = ROLES_LIST.map((r,i)=>({id:i, r, x:70+i*85, y:80+(i%3)*160, vx:0, vy:0, _m:[{t:'obs', c:`Born ${r}`, ts:0}]}));
  world.collectibles = {serpentCoil:false, memoryLantern:false, verdictCircle:false, solfeggioShard:false, mycelialKnot:false, verdictSeal:false};
}

function reset() {
  if (liveI) clearInterval(liveI);
  isLive = false;
  init();
  world = {proposals:[], coh:50, chaos:10, events:[], time:0, collectibles:{serpentCoil:false, memoryLantern:false, verdictCircle:false, solfeggioShard:false, mycelialKnot:false, verdictSeal:false}};
  sel = null;
  document.getElementById('props').innerHTML = '';
  log('RESET - all under triad');
}

window.stampAll = stampAll;
window.toggleLive = toggleLive;
window.step = step;

init();
log('LIVE-NPC started. 6 collectibles tappable when conditions met. Goblins mouthless. Triad active.');
game();
</script>
</body>
</html>
