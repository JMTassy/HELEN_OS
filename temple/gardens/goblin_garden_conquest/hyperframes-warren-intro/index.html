<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goblin Warren — HyperFrames Intro Asset</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* DESIGN.md palette — night warren HUD */
      :root {
        --bg: #06140e;
        --bg-lift: #0c2218;
        --fg: #e8f5e9;
        --muted: #8fb89a;
        --gold: #e8c84a;
        --purple: #c084fc;
        --magenta: #e879f9;
        --goblin: #5a9e4a;
        --goblin-dark: #3d6e32;
        --grid: rgba(90, 158, 74, 0.12);
      }

      body,
      html {
        margin: 0;
        padding: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: var(--bg);
        font-family: "Outfit", "Helvetica Neue", sans-serif;
      }

      #main-composition {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }

      /* --- Scene plate --- */
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .plate {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.28;
        filter: saturate(0.85) brightness(0.55) contrast(1.05);
      }

      .vignette {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 70% 60% at 50% 48%, transparent 20%, rgba(6, 20, 14, 0.55) 70%, rgba(6, 20, 14, 0.92) 100%),
          linear-gradient(180deg, rgba(6, 20, 14, 0.35) 0%, transparent 30%, transparent 70%, rgba(6, 20, 14, 0.75) 100%);
        pointer-events: none;
      }

      .grid-floor {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 48px 48px;
        background-position: center center;
        opacity: 0.55;
        mask-image: radial-gradient(ellipse 80% 70% at 50% 55%, #000 30%, transparent 85%);
        -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 55%, #000 30%, transparent 85%);
      }

      /* --- Akashic tree (CSS geometry) --- */
      .tree-wrap {
        position: absolute;
        left: 50%;
        top: 42%;
        width: 420px;
        height: 480px;
        transform: translate(-50%, -50%);
        z-index: 2;
      }

      .tree-canopy {
        position: absolute;
        left: 50%;
        top: 0;
        width: 340px;
        height: 280px;
        transform: translateX(-50%);
        border-radius: 50% 50% 45% 45%;
        background:
          radial-gradient(ellipse 60% 50% at 40% 40%, #e9d5ff 0%, transparent 45%),
          radial-gradient(ellipse 80% 70% at 50% 55%, #a855f7 0%, #6b21a8 55%, #4c1d75 100%);
        box-shadow:
          0 0 60px rgba(192, 132, 252, 0.45),
          0 0 120px rgba(232, 121, 249, 0.2);
      }

      .tree-trunk {
        position: absolute;
        left: 50%;
        bottom: 40px;
        width: 70px;
        height: 200px;
        transform: translateX(-50%);
        background: linear-gradient(180deg, #5b3a1e 0%, #3d2612 100%);
        border-radius: 8px 8px 4px 4px;
      }

      .tree-roots {
        position: absolute;
        left: 50%;
        bottom: 20px;
        width: 220px;
        height: 60px;
        transform: translateX(-50%);
        border-radius: 50%;
        background: radial-gradient(ellipse at center, #4a2f14 0%, transparent 70%);
        opacity: 0.85;
      }

      .tree-glow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 500px;
        height: 500px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(192, 132, 252, 0.28) 0%, transparent 65%);
        pointer-events: none;
      }

      .ember {
        position: absolute;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #fde68a;
        box-shadow: 0 0 8px #fbbf24;
        opacity: 0.85;
      }

      /* --- Lanterns --- */
      .lantern {
        position: absolute;
        z-index: 3;
        width: 28px;
        height: 40px;
      }

      .lantern::before {
        content: "";
        position: absolute;
        left: 4px;
        top: 8px;
        width: 20px;
        height: 24px;
        background: linear-gradient(180deg, #fde68a 0%, #d97706 100%);
        border-radius: 4px;
        box-shadow: 0 0 24px rgba(251, 191, 36, 0.7), 0 0 48px rgba(232, 200, 74, 0.35);
      }

      .lantern::after {
        content: "";
        position: absolute;
        left: 10px;
        top: 0;
        width: 8px;
        height: 10px;
        background: #5b3a1e;
        border-radius: 2px;
      }

      .lantern-l {
        left: 28%;
        top: 58%;
      }
      .lantern-r {
        left: 68%;
        top: 56%;
      }

      /* --- Mouthless goblins (flat geometric) --- */
      .goblin {
        position: absolute;
        z-index: 4;
        width: 72px;
        height: 96px;
      }

      .goblin .body {
        position: absolute;
        left: 50%;
        bottom: 0;
        width: 44px;
        height: 48px;
        transform: translateX(-50%);
        background: var(--goblin);
        border-radius: 14px 14px 10px 10px;
        box-shadow: inset -6px -4px 0 var(--goblin-dark);
      }

      .goblin .head {
        position: absolute;
        left: 50%;
        top: 4px;
        width: 48px;
        height: 42px;
        transform: translateX(-50%);
        background: var(--goblin);
        border-radius: 50% 50% 42% 42%;
        box-shadow: inset -5px -3px 0 var(--goblin-dark);
      }

      .goblin .ear {
        position: absolute;
        top: 10px;
        width: 0;
        height: 0;
        border-left: 10px solid transparent;
        border-right: 10px solid transparent;
        border-bottom: 22px solid var(--goblin);
      }

      .goblin .ear-l {
        left: 2px;
        transform: rotate(-28deg);
      }
      .goblin .ear-r {
        right: 2px;
        transform: rotate(28deg);
      }

      .goblin .eye {
        position: absolute;
        top: 18px;
        width: 7px;
        height: 9px;
        background: #0a1208;
        border-radius: 50%;
      }

      .goblin .eye-l {
        left: 14px;
      }
      .goblin .eye-r {
        right: 14px;
      }

      /* NO mouth — intentional */

      .goblin-a {
        left: 22%;
        top: 62%;
      }
      .goblin-b {
        left: 48%;
        top: 68%;
      }
      .goblin-c {
        left: 72%;
        top: 60%;
      }

      .goblin-b .body,
      .goblin-b .head {
        background: #6b4c9a;
        box-shadow: inset -6px -4px 0 #4a336e;
      }
      .goblin-b .ear {
        border-bottom-color: #6b4c9a;
      }

      .goblin-c .body,
      .goblin-c .head {
        background: #3d8f6e;
        box-shadow: inset -6px -4px 0 #2a6450;
      }
      .goblin-c .ear {
        border-bottom-color: #3d8f6e;
      }

      /* --- Center ring --- */
      .center-ring {
        position: absolute;
        left: 50%;
        top: 72%;
        width: 88px;
        height: 88px;
        transform: translate(-50%, -50%);
        border: 3px solid var(--magenta);
        border-radius: 50%;
        box-shadow: 0 0 20px rgba(232, 121, 249, 0.5), inset 0 0 12px rgba(232, 121, 249, 0.25);
        z-index: 3;
      }

      .center-ring::after {
        content: "";
        position: absolute;
        inset: 10px;
        border: 2px solid rgba(192, 132, 252, 0.55);
        border-radius: 50%;
      }

      /* --- Triad plate --- */
      .triad {
        position: absolute;
        left: 50%;
        top: 18%;
        transform: translateX(-50%);
        z-index: 6;
        width: 640px;
        padding: 22px 28px;
        background: rgba(12, 8, 24, 0.88);
        border: 2px solid var(--magenta);
        border-radius: 6px;
        box-shadow:
          0 0 0 1px rgba(192, 132, 252, 0.35),
          0 12px 40px rgba(0, 0, 0, 0.45),
          0 0 32px rgba(232, 121, 249, 0.2);
        font-family: "JetBrains Mono", "Courier New", monospace;
        color: var(--purple);
      }

      .triad .triad-label {
        font-size: 13px;
        letter-spacing: 0.22em;
        color: var(--magenta);
        margin-bottom: 10px;
        text-transform: uppercase;
      }

      .triad .line {
        font-size: 20px;
        line-height: 1.45;
        letter-spacing: 0.02em;
        color: #e9d5ff;
      }

      /* --- Title stack --- */
      .title-stack {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 72px;
        z-index: 7;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        width: 100%;
        padding: 0 80px;
        box-sizing: border-box;
      }

      .title {
        font-family: "Outfit", "Helvetica Neue", sans-serif;
        font-size: 92px;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: var(--fg);
        text-shadow:
          0 2px 0 rgba(0, 0, 0, 0.55),
          0 0 40px rgba(192, 132, 252, 0.35);
        margin: 0;
        text-align: center;
      }

      .tagline {
        font-family: "Outfit", "Helvetica Neue", sans-serif;
        font-size: 28px;
        font-weight: 400;
        letter-spacing: 0.04em;
        color: var(--gold);
        margin: 0;
        text-align: center;
      }

      .footer-stamp {
        font-family: "JetBrains Mono", "Courier New", monospace;
        font-size: 16px;
        letter-spacing: 0.16em;
        color: var(--muted);
        text-transform: uppercase;
        margin: 0;
        text-align: center;
      }

      .rule {
        width: 280px;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--gold), transparent);
        margin: 4px 0;
      }

      /* --- Grain (finite CSS steps — capture-safe) --- */
      .grain {
        position: absolute;
        inset: -20%;
        width: 140%;
        height: 140%;
        pointer-events: none;
        z-index: 50;
        opacity: 0.07;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
        mix-blend-mode: soft-light;
      }

      .hud-corner {
        position: absolute;
        z-index: 8;
        font-family: "JetBrains Mono", "Courier New", monospace;
        font-size: 14px;
        letter-spacing: 0.18em;
        color: var(--muted);
        text-transform: uppercase;
      }

      .hud-tl {
        top: 28px;
        left: 36px;
      }
      .hud-tr {
        top: 28px;
        right: 36px;
        color: var(--gold);
      }
    </style>
  </head>
  <body>
    <!--
      SIX DECISIONS (HeyGen Anatomy of a Prompt)
      Route: /motion-graphics
      Spec: 6-second · 1920×1080
      Beats: 0–2 establish · 2–3.5 triad · 3.5–6 title
      Copy: "GOBLIN WARREN" · "Les Gobelins rêvent. Vous décidez." · triad · stamp
      Technique: squash-and-settle · stagger · lantern breath · grain
      Negatives: no narration · no mouths · no SaaS cyan · no false admission
    -->
    <div
      id="main-composition"
      data-composition-id="main"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="6"
    >
      <div class="scene" id="scene-root">
        <img
          class="plate"
          id="plate"
          src="assets/home-page-preview.jpg"
          alt=""
          crossorigin="anonymous"
        />
        <div class="grid-floor" id="grid"></div>
        <div class="vignette"></div>

        <div class="tree-wrap" id="tree">
          <div class="tree-glow" id="tree-glow"></div>
          <div class="tree-canopy"></div>
          <div class="tree-trunk"></div>
          <div class="tree-roots"></div>
          <div class="ember" id="ember1" style="left: 28%; top: 22%"></div>
          <div class="ember" id="ember2" style="left: 62%; top: 18%"></div>
          <div class="ember" id="ember3" style="left: 48%; top: 38%"></div>
          <div class="ember" id="ember4" style="left: 36%; top: 48%"></div>
        </div>

        <div class="lantern lantern-l" id="lantern-l"></div>
        <div class="lantern lantern-r" id="lantern-r"></div>

        <div class="center-ring" id="center-ring"></div>

        <div class="goblin goblin-a" id="goblin-a">
          <div class="ear ear-l"></div>
          <div class="ear ear-r"></div>
          <div class="head">
            <div class="eye eye-l"></div>
            <div class="eye eye-r"></div>
          </div>
          <div class="body"></div>
        </div>
        <div class="goblin goblin-b" id="goblin-b">
          <div class="ear ear-l"></div>
          <div class="ear ear-r"></div>
          <div class="head">
            <div class="eye eye-l"></div>
            <div class="eye eye-r"></div>
          </div>
          <div class="body"></div>
        </div>
        <div class="goblin goblin-c" id="goblin-c">
          <div class="ear ear-l"></div>
          <div class="ear ear-r"></div>
          <div class="head">
            <div class="eye eye-l"></div>
            <div class="eye eye-r"></div>
          </div>
          <div class="body"></div>
        </div>

        <div class="triad" id="triad">
          <div class="triad-label">200-EPOCH TRIAD</div>
          <div class="line" id="triad-l1">No location → no doctrine.</div>
          <div class="line" id="triad-l2">No test → no gate.</div>
          <div class="line" id="triad-l3">No replay → no admission.</div>
        </div>

        <div class="title-stack" id="title-stack">
          <div class="rule" id="rule-top"></div>
          <h1 class="title" id="title">GOBLIN WARREN</h1>
          <p class="tagline" id="tagline">Les Gobelins rêvent. Vous décidez.</p>
          <div class="rule" id="rule-bot"></div>
          <p class="footer-stamp" id="footer">
            HELEN CONQUEST · GARDEN · authority:false
          </p>
        </div>

        <div class="hud-corner hud-tl" id="hud-tl">GARDEN · NON_SOVEREIGN</div>
        <div class="hud-corner hud-tr" id="hud-tr">LIVE · STEP · HOLD</div>
      </div>

      <div class="grain" id="grain"></div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        /* Initial hidden states via timeline sets (not gsap.set on delayed clips) */
        tl.set(
          [
            "#plate",
            "#grid",
            "#tree",
            "#lantern-l",
            "#lantern-r",
            "#center-ring",
            "#goblin-a",
            "#goblin-b",
            "#goblin-c",
            "#triad",
            "#triad-l1",
            "#triad-l2",
            "#triad-l3",
            "#title",
            "#tagline",
            "#footer",
            "#rule-top",
            "#rule-bot",
            "#hud-tl",
            "#hud-tr",
            "#ember1",
            "#ember2",
            "#ember3",
            "#ember4",
          ],
          { opacity: 0 },
          0
        );
        tl.set(["#goblin-a"], { y: 80, x: -40 }, 0);
        tl.set(["#goblin-b"], { y: 90 }, 0);
        tl.set(["#goblin-c"], { y: 80, x: 50 }, 0);
        tl.set(["#triad"], { scale: 0.86, transformOrigin: "50% 50%" }, 0);
        tl.set(["#title"], { scale: 0.92, y: 28, transformOrigin: "50% 50%" }, 0);
        tl.set(["#tree"], { scale: 0.94, transformOrigin: "50% 70%" }, 0);

        /* ===== Beat 1 (0–2s): establish warren ===== */
        tl.to("#plate", { opacity: 0.28, duration: 1.1, ease: "power2.out" }, 0.15);
        tl.to("#grid", { opacity: 0.55, duration: 0.9, ease: "sine.out" }, 0.25);
        tl.to(
          "#tree",
          { opacity: 1, scale: 1, duration: 1.0, ease: "power3.out" },
          0.3
        );
        tl.to("#tree-glow", { opacity: 1, duration: 1.2, ease: "sine.inOut" }, 0.4);
        tl.to(
          ["#lantern-l", "#lantern-r"],
          { opacity: 1, duration: 0.55, ease: "power2.out", stagger: 0.12 },
          0.55
        );
        tl.to("#center-ring", { opacity: 1, duration: 0.5, ease: "back.out(1.4)" }, 0.85);
        tl.to(
          "#goblin-a",
          { opacity: 1, x: 0, y: 0, duration: 0.75, ease: "power3.out" },
          0.95
        );
        tl.to(
          "#goblin-c",
          { opacity: 1, x: 0, y: 0, duration: 0.75, ease: "power3.out" },
          1.05
        );
        tl.to(
          "#goblin-b",
          { opacity: 1, y: 0, duration: 0.7, ease: "back.out(1.2)" },
          1.15
        );
        tl.to(
          ["#hud-tl", "#hud-tr"],
          { opacity: 1, duration: 0.4, ease: "power1.out", stagger: 0.08 },
          1.2
        );

        /* Ambient lantern breath + embers (finite — 6s capture) */
        tl.to(
          ["#lantern-l", "#lantern-r"],
          {
            scale: 1.08,
            duration: 0.7,
            ease: "sine.inOut",
            yoyo: true,
            repeat: 3,
            transformOrigin: "50% 80%",
          },
          1.4
        );
        tl.to(
          ["#ember1", "#ember2", "#ember3", "#ember4"],
          {
            opacity: 0.9,
            y: -18,
            duration: 1.4,
            ease: "sine.out",
            stagger: 0.18,
            repeat: 2,
            yoyo: true,
          },
          0.8
        );

        /* ===== Beat 2 (2–3.5s): triad stamp ===== */
        tl.to(
          "#triad",
          {
            opacity: 1,
            scale: 1.04,
            duration: 0.35,
            ease: "back.out(1.6)",
          },
          2.05
        );
        tl.to(
          "#triad",
          { scale: 1, duration: 0.28, ease: "power2.out" },
          2.4
        );
        tl.to("#triad-l1", { opacity: 1, duration: 0.28, ease: "power2.out" }, 2.35);
        tl.to("#triad-l2", { opacity: 1, duration: 0.28, ease: "power2.out" }, 2.55);
        tl.to("#triad-l3", { opacity: 1, duration: 0.28, ease: "power2.out" }, 2.75);
        tl.to(
          "#center-ring",
          {
            scale: 1.12,
            duration: 0.35,
            ease: "sine.inOut",
            yoyo: true,
            repeat: 1,
            transformOrigin: "50% 50%",
          },
          2.1
        );

        /* ===== Beat 3 (3.5–6s): title settle ===== */
        tl.to("#rule-top", { opacity: 1, duration: 0.3, ease: "power1.out" }, 3.55);
        tl.to(
          "#title",
          {
            opacity: 1,
            y: 0,
            scale: 1.04,
            duration: 0.45,
            ease: "back.out(1.3)",
          },
          3.65
        );
        tl.to("#title", { scale: 1, duration: 0.28, ease: "power2.out" }, 4.1);
        tl.to("#tagline", { opacity: 1, duration: 0.45, ease: "power3.out" }, 4.15);
        tl.to("#rule-bot", { opacity: 1, duration: 0.3, ease: "power1.out" }, 4.35);
        tl.to("#footer", { opacity: 1, duration: 0.4, ease: "power2.out" }, 4.5);

        /* Final hold breath — last scene may soft settle (no hard exit wipe) */
        tl.to(
          "#tree-glow",
          {
            scale: 1.06,
            duration: 0.8,
            ease: "sine.inOut",
            yoyo: true,
            repeat: 1,
            transformOrigin: "50% 50%",
          },
          4.8
        );

        window.__timelines["main"] = tl;
      </script>
    </div>
  </body>
</html>
