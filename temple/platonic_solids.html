<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>HELEN OS — Platonic Solids</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #060810; color: #c9d1d9; font-family: ui-monospace, monospace; overflow: hidden; }
canvas { display: block; }
#ui {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 20px; background: rgba(6,8,16,0.85);
  border-bottom: 1px solid #1e2430; z-index: 10;
}
#title { color: #58a6ff; font-size: 13px; letter-spacing: 0.1em; }
#selector { display: flex; gap: 8px; }
.btn {
  padding: 4px 10px; border: 1px solid #30363d; border-radius: 3px;
  background: transparent; color: #7d8590; cursor: pointer;
  font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: 0.05em;
  transition: all 0.15s;
}
.btn:hover { border-color: #58a6ff; color: #c9d1d9; }
.btn.active { background: #1c2b45; border-color: #58a6ff; color: #58a6ff; }
#info {
  position: fixed; bottom: 0; left: 0; right: 0;
  padding: 10px 20px; background: rgba(6,8,16,0.85);
  border-top: 1px solid #1e2430; z-index: 10;
  display: flex; gap: 40px; align-items: center;
}
.stat { font-size: 11px; color: #484f58; }
.stat span { color: #c9d1d9; }
#label {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -80px);
  text-align: center; pointer-events: none; z-index: 10;
}
#solid-name { font-size: 22px; color: #ffffff; letter-spacing: 0.15em; }
#solid-role { font-size: 11px; color: #7d8590; margin-top: 4px; letter-spacing: 0.08em; }
#solid-law  { font-size: 10px; margin-top: 6px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div id="ui">
  <div id="title">HELEN OS — PLATONIC SOLIDS</div>
  <div id="selector">
    <button class="btn active" onclick="select(0)">TETRAHEDRON</button>
    <button class="btn" onclick="select(1)">CUBE</button>
    <button class="btn" onclick="select(2)">OCTAHEDRON</button>
    <button class="btn" onclick="select(3)">DODECAHEDRON</button>
    <button class="btn" onclick="select(4)">ICOSAHEDRON</button>
  </div>
</div>
<div id="label">
  <div id="solid-name">TETRAHEDRON</div>
  <div id="solid-role">HAL — Hard Gate</div>
  <div id="solid-law"></div>
</div>
<canvas id="c"></canvas>
<div id="info">
  <div class="stat">FACES <span id="s-faces">—</span></div>
  <div class="stat">VERTICES <span id="s-verts">—</span></div>
  <div class="stat">EDGES <span id="s-edges">—</span></div>
  <div class="stat">AUTHORITY <span id="s-auth">NON_SOVEREIGN</span></div>
  <div class="stat">CANON <span id="s-canon">NO_SHIP</span></div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ── Constitutional solid definitions ──────────────────────────────────────
const SOLIDS = [
  {
    name: 'TETRAHEDRON', role: 'HAL — Hard Gate (BLOCK/PASS)',
    law: 'BLOCK/PASS. No partial verdicts.',
    color: '#f85149', faces: 4, verts: 4, edges: 6,
    vertices: () => {
      const s = 1;
      return [
        [ s,  s,  s], [ s, -s, -s], [-s,  s, -s], [-s, -s,  s]
      ];
    },
    triangles: [[0,1,2],[0,2,3],[0,3,1],[1,3,2]],
  },
  {
    name: 'CUBE', role: 'LEDGER — Append-Only Chain',
    law: 'NO RECEIPT = NO CLAIM. Append-only.',
    color: '#58a6ff', faces: 6, verts: 8, edges: 12,
    vertices: () => {
      const h = 0.8;
      return [
        [-h,-h,-h],[ h,-h,-h],[ h, h,-h],[-h, h,-h],
        [-h,-h, h],[ h,-h, h],[ h, h, h],[-h, h, h],
      ];
    },
    triangles: [
      [0,1,2],[0,2,3],[4,6,5],[4,7,6],
      [0,5,1],[0,4,5],[2,6,7],[2,7,3],
      [0,7,4],[0,3,7],[1,5,6],[1,6,2],
    ],
  },
  {
    name: 'OCTAHEDRON', role: 'HER — Signal Preservation Layer',
    law: 'Relational continuity. Witness. No claim.',
    color: '#3fb950', faces: 8, verts: 6, edges: 12,
    vertices: () => {
      const r = 1.1;
      return [
        [r,0,0],[-r,0,0],[0,r,0],[0,-r,0],[0,0,r],[0,0,-r]
      ];
    },
    triangles: [
      [0,2,4],[0,4,3],[0,3,5],[0,5,2],
      [1,4,2],[1,3,4],[1,5,3],[1,2,5],
    ],
  },
  {
    name: 'DODECAHEDRON', role: 'MAYOR — Sole Signatory',
    law: 'MAYOR signs alone. No multi-sig.',
    color: '#d29922', faces: 12, verts: 20, edges: 30,
    vertices: () => {
      const phi = (1 + Math.sqrt(5)) / 2;
      const a = 0.7, b = a / phi, c = a * phi;
      return [
        [ a, a, a],[ a, a,-a],[ a,-a, a],[ a,-a,-a],
        [-a, a, a],[-a, a,-a],[-a,-a, a],[-a,-a,-a],
        [0, b, c],[0, b,-c],[0,-b, c],[0,-b,-c],
        [ c,0, b],[ c,0,-b],[-c,0, b],[-c,0,-b],
        [ b, c,0],[ b,-c,0],[-b, c,0],[-b,-c,0],
      ];
    },
    triangles: [
      [0,8,10],[0,10,2],[0,2,12],[0,12,13],[0,13,1],[0,1,16],[0,16,18],[0,18,4],[0,4,8],
      [7,6,14],[7,14,15],[7,15,5],[7,5,9],[7,9,11],[7,11,3],[7,3,17],[7,17,19],[7,19,6],
      [8,4,14],[4,18,14],[18,5,14],[5,15,9],[15,1,9],[1,13,9],
      [13,3,11],[3,11,17],[11,10,17],[10,6,17],[6,19,10],[19,2,10],
      [2,12,19],[12,3,19],[12,13,3],[13,1,15],[1,16,15],[16,5,15],
      [18,16,5],[18,4,16],[4,8,18],
    ],
  },
  {
    name: 'ICOSAHEDRON', role: 'TEMPLE — Emergent Layer',
    law: 'Non-sovereign generative emergence.',
    color: '#a371f7', faces: 20, verts: 12, edges: 30,
    vertices: () => {
      const phi = (1 + Math.sqrt(5)) / 2;
      const r = 0.9;
      const v = [];
      const pairs = [[0,1,phi],[0,-1,phi],[0,1,-phi],[0,-1,-phi],
                     [1,phi,0],[-1,phi,0],[1,-phi,0],[-1,-phi,0],
                     [phi,0,1],[phi,0,-1],[-phi,0,1],[-phi,0,-1]];
      for (const [x,y,z] of pairs) {
        const len = Math.sqrt(x*x+y*y+z*z);
        v.push([x/len*r, y/len*r, z/len*r]);
      }
      return v;
    },
    triangles: [
      [0,8,4],[0,4,5],[0,5,10],[0,10,1],[0,1,8],
      [3,9,2],[3,2,11],[3,11,7],[3,7,6],[3,6,9],
      [8,1,6],[1,10,7],[10,5,11],[5,4,2],[4,8,9],
      [6,7,3],[7,11,3],[11,2,3],[2,9,3],[9,6,3],
      [8,6,1],[1,7,10],[10,11,5],[5,2,4],[4,9,8],
    ],
  },
];

// ── State ──────────────────────────────────────────────────────────────────
let current = 0;
let rx = 0.4, ry = 0.3;
let drx = 0, dry = 0.005;
let dragging = false, lastX = 0, lastY = 0;
let morphT = 0; // transition progress 0→1
let morphFrom = null, morphTarget = null;

function select(i) {
  if (i === current && morphFrom === null) return;
  document.querySelectorAll('.btn').forEach((b,j) => b.classList.toggle('active', j===i));
  morphFrom = getVertices(current);
  morphTarget = getVertices(i);
  morphT = 0;
  current = i;
  const s = SOLIDS[i];
  document.getElementById('solid-name').textContent = s.name;
  document.getElementById('solid-role').textContent = s.role;
  document.getElementById('solid-law').style.color = s.color;
  document.getElementById('solid-law').textContent = s.law;
  document.getElementById('s-faces').textContent = s.faces;
  document.getElementById('s-verts').textContent = s.verts;
  document.getElementById('s-edges').textContent = s.edges;
  document.getElementById('solid-name').style.color = s.color;
}

// ── 3D helpers ─────────────────────────────────────────────────────────────
function rotX(v, a) {
  const [x,y,z] = v, c=Math.cos(a), s=Math.sin(a);
  return [x, y*c-z*s, y*s+z*c];
}
function rotY(v, a) {
  const [x,y,z] = v, c=Math.cos(a), s=Math.sin(a);
  return [x*c+z*s, y, -x*s+z*c];
}
function project(v, cx, cy, scale) {
  const z = v[2] + 3.5;
  const px = cx + v[0] / z * scale;
  const py = cy + v[1] / z * scale;
  return [px, py, z];
}
function faceNormal(tri, verts) {
  const a = verts[tri[0]], b = verts[tri[1]], c = verts[tri[2]];
  const ab = [b[0]-a[0],b[1]-a[1],b[2]-a[2]];
  const ac = [c[0]-a[0],c[1]-a[1],c[2]-a[2]];
  return [
    ab[1]*ac[2]-ab[2]*ac[1],
    ab[2]*ac[0]-ab[0]*ac[2],
    ab[0]*ac[1]-ab[1]*ac[0],
  ];
}

// ── Resize ──────────────────────────────────────────────────────────────────
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ── Get transformed vertices ─────────────────────────────────────────────
function getVertices(idx) {
  return SOLIDS[idx].vertices();
}

function interpVerts(from, to, t, count) {
  const out = [];
  const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
  for (let i = 0; i < count; i++) {
    const fi = from[i % from.length];
    const ti = to[i % to.length];
    out.push([
      fi[0] + (ti[0]-fi[0])*ease,
      fi[1] + (ti[1]-fi[1])*ease,
      fi[2] + (ti[2]-fi[2])*ease,
    ]);
  }
  return out;
}

// ── Draw ───────────────────────────────────────────────────────────────────
function draw() {
  const W = canvas.width, H = canvas.height;
  const scale = Math.min(W, H) * 0.32;
  const cx = W/2, cy = H/2;

  ctx.clearRect(0,0,W,H);

  // Background glow
  const sol = SOLIDS[current];
  const grd = ctx.createRadialGradient(cx,cy,0,cx,cy,scale*0.9);
  grd.addColorStop(0, sol.color + '12');
  grd.addColorStop(1, 'transparent');
  ctx.fillStyle = grd;
  ctx.fillRect(0,0,W,H);

  // Morph progress
  let rawVerts;
  if (morphFrom && morphTarget && morphT < 1) {
    morphT = Math.min(1, morphT + 0.04);
    rawVerts = interpVerts(morphFrom, morphTarget, morphT, sol.vertices().length);
    if (morphT >= 1) { morphFrom = null; morphTarget = null; }
  } else {
    rawVerts = sol.vertices();
  }

  // Rotate
  const verts3d = rawVerts.map(v => {
    let r = rotY(v, ry);
    r = rotX(r, rx);
    return r;
  });

  // Project
  const proj = verts3d.map(v => project(v, cx, cy, scale));

  // Sort faces by depth
  const tris = sol.triangles;
  const sorted = tris.map((tri, i) => {
    const depth = (proj[tri[0]][2] + proj[tri[1]][2] + proj[tri[2]][2]) / 3;
    return {tri, depth, i};
  }).sort((a,b) => b.depth - a.depth);

  // Light direction (fixed)
  const light = [0.4, 0.6, 1.0];
  const lLen = Math.sqrt(light[0]**2+light[1]**2+light[2]**2);
  const ln = light.map(x=>x/lLen);

  for (const {tri} of sorted) {
    const n = faceNormal(tri, verts3d);
    const nLen = Math.sqrt(n[0]**2+n[1]**2+n[2]**2);
    if (nLen < 1e-6) continue;
    const nn = n.map(x=>x/nLen);
    const dot = nn[0]*ln[0]+nn[1]*ln[1]+nn[2]*ln[2];

    // Cull back-faces (but keep them dim for wireframe)
    const facing = dot > 0;

    const p0 = proj[tri[0]], p1 = proj[tri[1]], p2 = proj[tri[2]];

    if (facing) {
      const brightness = 0.15 + 0.65 * dot;
      ctx.beginPath();
      ctx.moveTo(p0[0],p0[1]);
      ctx.lineTo(p1[0],p1[1]);
      ctx.lineTo(p2[0],p2[1]);
      ctx.closePath();
      ctx.fillStyle = hexAlpha(sol.color, brightness * 0.45);
      ctx.fill();
    }

    // Edges
    const edgeAlpha = facing ? 0.8 : 0.12;
    ctx.beginPath();
    ctx.moveTo(p0[0],p0[1]);
    ctx.lineTo(p1[0],p1[1]);
    ctx.lineTo(p2[0],p2[1]);
    ctx.closePath();
    ctx.strokeStyle = hexAlpha(sol.color, edgeAlpha);
    ctx.lineWidth = facing ? 1.2 : 0.5;
    ctx.stroke();
  }

  // Vertex dots
  for (const [px,py] of proj) {
    ctx.beginPath();
    ctx.arc(px, py, 3, 0, Math.PI*2);
    ctx.fillStyle = sol.color + 'cc';
    ctx.fill();
  }

  // Auto-rotate
  if (!dragging) {
    ry += dry;
    rx += drx;
  }
}

function hexAlpha(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ── Mouse / touch ──────────────────────────────────────────────────────────
canvas.addEventListener('mousedown', e => { dragging=true; lastX=e.clientX; lastY=e.clientY; });
window.addEventListener('mouseup', () => { dragging=false; dry=0.005; drx=0; });
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  ry += dx * 0.01; rx += dy * 0.01;
  dry = dx * 0.003; drx = dy * 0.002;
  lastX = e.clientX; lastY = e.clientY;
});

// Keyboard: 1-5 select solid
window.addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= '5') select(+e.key - 1);
});

// ── Init ───────────────────────────────────────────────────────────────────
select(0);
function loop() { draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
