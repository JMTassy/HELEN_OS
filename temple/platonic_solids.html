<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>HELEN OS — Constitutional Cosmogram</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #060810; color: #c9d1d9; font-family: ui-monospace, monospace; overflow: hidden; }
canvas { display: block; cursor: pointer; }

#top {
  position: fixed; top: 0; left: 0; right: 0;
  padding: 18px 0 8px 0; text-align: center; z-index: 10;
  pointer-events: none;
}
#title {
  font-size: 22px; letter-spacing: 0.35em; color: #d8d4c0;
  font-family: Georgia, serif; font-weight: 300;
}
#subtitle {
  font-size: 10px; letter-spacing: 0.4em; color: #5a6270;
  margin-top: 4px;
}
#banner {
  font-size: 11px; letter-spacing: 0.32em; color: #8a7d5a;
  margin-top: 18px;
  font-family: Georgia, serif;
}

#bottom {
  position: fixed; bottom: 0; left: 0; right: 0;
  z-index: 10; pointer-events: none;
}
#footer-tag {
  text-align: center; font-size: 11px; letter-spacing: 0.4em;
  color: #6a604a; padding: 8px 0;
  font-family: Georgia, serif;
}
#info {
  display: flex; gap: 32px; justify-content: center;
  padding: 8px 20px 14px 20px;
  font-size: 9px; letter-spacing: 0.12em; color: #2c333e;
  border-top: 1px solid #14181f;
}
.stat span { color: #6a7280; margin-left: 6px; }

/* Focus contract block (only visible in focus mode) */
#contract {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -100px);
  text-align: center; pointer-events: none; z-index: 8;
  width: 90%; max-width: 680px;
  opacity: 0; transition: opacity 0.4s;
}
#contract.visible { opacity: 1; }
#solid-name { font-size: 28px; letter-spacing: 0.28em; font-family: Georgia, serif; }
#solid-role { font-size: 10px; color: #7d8590; margin-top: 8px; letter-spacing: 0.22em; }
#solid-law  { font-size: 10px; margin-top: 10px; letter-spacing: 0.08em; opacity: 0.85; }

#hint {
  position: fixed; bottom: 52px; left: 50%; transform: translateX(-50%);
  font-size: 9px; letter-spacing: 0.3em; color: #2c333e; z-index: 8;
  pointer-events: none; transition: opacity 0.4s;
}
</style>
</head>
<body>
<div id="top">
  <div id="title">HELEN OS</div>
  <div id="subtitle">A CONSTITUTIONAL INTERACTIVE INTERFACE</div>
  <div id="banner">PERSPECTIVE CAN ROTATE.&nbsp;&nbsp;&nbsp;LAW REMAINS INVARIANT.</div>
</div>

<div id="contract">
  <div id="solid-name"></div>
  <div id="solid-role"></div>
  <div id="solid-law"></div>
</div>

<div id="hint">CLICK A FORM TO ENTER FOCUS · KEYS 1–5 · ESC TO RETURN</div>

<canvas id="c"></canvas>

<div id="bottom">
  <div id="footer-tag">FIVE FORMS.&nbsp;&nbsp;&nbsp;ONE LAW.</div>
  <div id="info">
    <div class="stat">DOCTRINE<span>PLATONIC_INTERFACE_SEMANTICS_V1</span></div>
    <div class="stat">CANON<span>NO_SHIP</span></div>
    <div class="stat">AUTHORITY<span>NON_SOVEREIGN</span></div>
    <div class="stat">MODE<span id="s-mode">ATLAS</span></div>
  </div>
</div>

<script>
// ── PLATONIC_INTERFACE_SEMANTICS_V1 — canonical mapping ───────────────────
// Order is doctrinal: KERNEL must be index 0 (the sovereign core).
const SOLIDS = [
  {
    name: 'KERNEL', subtitle: 'TETRAHEDRON',
    role: 'SOVEREIGN PRINCIPLE',
    law: 'Minimal. Invariant. Final. The kernel signs alone. NO RECEIPT = NO CLAIM.',
    color: '#e8c870',  // sovereign gold
    faces: 4, verts: 4, edges: 6,
    authority: 'SOVEREIGN',
    vertices: () => {
      const s = 1;
      return [[ s,  s,  s],[ s, -s, -s],[-s,  s, -s],[-s, -s,  s]];
    },
    triangles: [[0,1,2],[0,2,3],[0,3,1],[1,3,2]],
  },
  {
    name: 'MEMORY FABRIC', subtitle: 'CUBE',
    role: 'STRUCTURED RECORD',
    law: 'Stable continuity. Addressable. Recall is not law.',
    color: '#4a8fcc',  // archival blue
    faces: 6, verts: 8, edges: 12,
    authority: 'NON_SOVEREIGN',
    vertices: () => {
      const h = 0.8;
      return [
        [-h,-h,-h],[ h,-h,-h],[ h, h,-h],[-h, h,-h],
        [-h,-h, h],[ h,-h, h],[ h, h, h],[-h, h, h],
      ];
    },
    triangles: [
      [0,1,2],[0,2,3],[4,6,5],[4,7,6],
      [0,5,1],[0,4,5],[2,6,7],[2,7,3],
      [0,7,4],[0,3,7],[1,5,6],[1,6,2],
    ],
  },
  {
    name: 'HAL EVALUATOR', subtitle: 'OCTAHEDRON',
    role: 'CONSTITUTIONAL JUDGEMENT',
    law: 'Balance. Measure. Admissibility through opposition. PASS or BLOCK.',
    color: '#d04040',  // verdict red
    faces: 8, verts: 6, edges: 12,
    authority: 'GATE',
    vertices: () => {
      const r = 1.1;
      return [[r,0,0],[-r,0,0],[0,r,0],[0,-r,0],[0,0,r],[0,0,-r]];
    },
    triangles: [
      [0,2,4],[0,4,3],[0,3,5],[0,5,2],
      [1,4,2],[1,3,4],[1,5,3],[1,2,5],
    ],
  },
  {
    name: 'CONQUEST', subtitle: 'ICOSAHEDRON · SWARM EXPLORATION',
    role: 'ADAPTIVE REACH',
    law: 'Seek. Map. Extend. Bounded exploration. Reach without losing the center.',
    color: '#5fa872',  // growth green
    faces: 20, verts: 12, edges: 30,
    authority: 'NON_SOVEREIGN',
    vertices: () => {
      const phi = (1 + Math.sqrt(5)) / 2;
      const r = 0.9;
      const v = [];
      const pairs = [[0,1,phi],[0,-1,phi],[0,1,-phi],[0,-1,-phi],
                     [1,phi,0],[-1,phi,0],[1,-phi,0],[-1,-phi,0],
                     [phi,0,1],[phi,0,-1],[-phi,0,1],[-phi,0,-1]];
      for (const [x,y,z] of pairs) {
        const len = Math.sqrt(x*x+y*y+z*z);
        v.push([x/len*r, y/len*r, z/len*r]);
      }
      return v;
    },
    triangles: [
      [0,8,4],[0,4,5],[0,5,10],[0,10,1],[0,1,8],
      [3,9,2],[3,2,11],[3,11,7],[3,7,6],[3,6,9],
      [8,1,6],[1,10,7],[10,5,11],[5,4,2],[4,8,9],
      [6,7,3],[7,11,3],[11,2,3],[2,9,3],[9,6,3],
      [8,6,1],[1,7,10],[10,11,5],[5,2,4],[4,9,8],
    ],
  },
  {
    name: 'AURA', subtitle: 'DODECAHEDRON · SYMBOLIC ATLAS',
    role: 'CULTURAL MEMORY',
    law: 'Meaning. Pattern. Symbolic coherence. Feeling without becoming law.',
    color: '#9c70d4',  // cosmic violet
    faces: 12, verts: 20, edges: 30,
    authority: 'NON_SOVEREIGN',
    vertices: () => {
      const phi = (1 + Math.sqrt(5)) / 2;
      const a = 0.7, b = a / phi, c = a * phi;
      return [
        [ a, a, a],[ a, a,-a],[ a,-a, a],[ a,-a,-a],
        [-a, a, a],[-a, a,-a],[-a,-a, a],[-a,-a,-a],
        [0, b, c],[0, b,-c],[0,-b, c],[0,-b,-c],
        [ c,0, b],[ c,0,-b],[-c,0, b],[-c,0,-b],
        [ b, c,0],[ b,-c,0],[-b, c,0],[-b,-c,0],
      ];
    },
    triangles: [
      [0,8,10],[0,10,2],[0,2,12],[0,12,13],[0,13,1],[0,1,16],[0,16,18],[0,18,4],[0,4,8],
      [7,6,14],[7,14,15],[7,15,5],[7,5,9],[7,9,11],[7,11,3],[7,3,17],[7,17,19],[7,19,6],
      [8,4,14],[4,18,14],[18,5,14],[5,15,9],[15,1,9],[1,13,9],
      [13,3,11],[3,11,17],[11,10,17],[10,6,17],[6,19,10],[19,2,10],
      [2,12,19],[12,3,19],[12,13,3],[13,1,15],[1,16,15],[16,5,15],
      [18,16,5],[18,4,16],[4,8,18],
    ],
  },
];

// Atlas layout — KERNEL centered, others at corners (matches the canon)
// idx → position fraction (x, y) and relative scale factor
const ATLAS_LAYOUT = [
  { idx: 0, fx: 0.50, fy: 0.52, scale: 0.075, label: 'below' }, // KERNEL center, smaller
  { idx: 1, fx: 0.22, fy: 0.33, scale: 0.110, label: 'left'  }, // MEMORY top-left
  { idx: 2, fx: 0.78, fy: 0.33, scale: 0.110, label: 'right' }, // HAL top-right
  { idx: 3, fx: 0.22, fy: 0.72, scale: 0.110, label: 'left'  }, // CONQUEST bottom-left
  { idx: 4, fx: 0.78, fy: 0.72, scale: 0.110, label: 'right' }, // AURA bottom-right
];

// ── State ──────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let mode = 'atlas';           // 'atlas' or 'focus'
let modeT = 1;                // transition progress 0..1
let focusIdx = 0;             // current solid in focus mode
let rx = 0.42, ry = 0.35;
let drx = 0, dry = 0.004;
let dragging = false, lastX = 0, lastY = 0;
let dragStartedOn = null;     // for click vs drag detection
let mouseDownPos = null;

// ── Resize ─────────────────────────────────────────────────────────────────
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ── 3D helpers ─────────────────────────────────────────────────────────────
function rotX(v, a) { const [x,y,z]=v,c=Math.cos(a),s=Math.sin(a); return [x,y*c-z*s,y*s+z*c]; }
function rotY(v, a) { const [x,y,z]=v,c=Math.cos(a),s=Math.sin(a); return [x*c+z*s,y,-x*s+z*c]; }
function project(v, cx, cy, scale) {
  const z = v[2] + 3.5;
  return [cx + v[0] / z * scale, cy + v[1] / z * scale, z];
}
function faceNormal(tri, verts) {
  const a=verts[tri[0]],b=verts[tri[1]],c=verts[tri[2]];
  const ab=[b[0]-a[0],b[1]-a[1],b[2]-a[2]], ac=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];
  return [ab[1]*ac[2]-ab[2]*ac[1], ab[2]*ac[0]-ab[0]*ac[2], ab[0]*ac[1]-ab[1]*ac[0]];
}
function hexAlpha(hex, alpha) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ── Render one solid at given (cx, cy, scale, alpha) ──────────────────────
function renderSolid(sol, cx, cy, scale, alpha, highlight) {
  if (alpha <= 0.01) return;

  const verts3d = sol.vertices().map(v => rotX(rotY(v, ry), rx));
  const proj = verts3d.map(v => project(v, cx, cy, scale));

  const sorted = sol.triangles.map((tri) => {
    const depth = (proj[tri[0]][2] + proj[tri[1]][2] + proj[tri[2]][2]) / 3;
    return {tri, depth};
  }).sort((a,b) => b.depth - a.depth);

  const light = [0.4, 0.6, 1.0];
  const lLen = Math.sqrt(light[0]**2+light[1]**2+light[2]**2);
  const ln = light.map(x=>x/lLen);

  // Subtle glow when highlighted (KERNEL always gets a gentle radiance)
  if (highlight || sol.name === 'KERNEL') {
    const glowR = scale * 1.2;
    const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
    grd.addColorStop(0, hexAlpha(sol.color, 0.18 * alpha));
    grd.addColorStop(1, 'transparent');
    ctx.fillStyle = grd;
    ctx.fillRect(cx - glowR, cy - glowR, glowR * 2, glowR * 2);
  }

  for (const {tri} of sorted) {
    const n = faceNormal(tri, verts3d);
    const nLen = Math.sqrt(n[0]**2+n[1]**2+n[2]**2);
    if (nLen < 1e-6) continue;
    const nn = n.map(x => x/nLen);
    const dot = nn[0]*ln[0]+nn[1]*ln[1]+nn[2]*ln[2];
    const facing = dot > 0;

    const p0=proj[tri[0]], p1=proj[tri[1]], p2=proj[tri[2]];

    if (facing) {
      const brightness = 0.15 + 0.65 * dot;
      ctx.beginPath();
      ctx.moveTo(p0[0],p0[1]); ctx.lineTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]); ctx.closePath();
      ctx.fillStyle = hexAlpha(sol.color, brightness * 0.40 * alpha);
      ctx.fill();
    }

    const edgeAlpha = (facing ? 0.85 : 0.10) * alpha;
    ctx.beginPath();
    ctx.moveTo(p0[0],p0[1]); ctx.lineTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]); ctx.closePath();
    ctx.strokeStyle = hexAlpha(sol.color, edgeAlpha);
    ctx.lineWidth = facing ? 1.2 : 0.5;
    ctx.stroke();
  }

  for (const [px,py] of proj) {
    ctx.beginPath();
    ctx.arc(px, py, 2.5, 0, Math.PI*2);
    ctx.fillStyle = hexAlpha(sol.color, 0.85 * alpha);
    ctx.fill();
  }
}

// ── Atlas labels ───────────────────────────────────────────────────────────
function drawAtlasLabel(slot, sol, W, H, alpha) {
  const cx = slot.fx * W, cy = slot.fy * H;
  const scale = Math.min(W, H) * slot.scale;
  let lx, ly, align;
  if (slot.label === 'left')  { lx = cx - scale - 24; ly = cy; align = 'right'; }
  else if (slot.label === 'right') { lx = cx + scale + 24; ly = cy; align = 'left'; }
  else { lx = cx; ly = cy + scale + 30; align = 'center'; }

  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.fillStyle = hexAlpha(sol.color, 0.95 * alpha);
  ctx.font = '300 13px Georgia, serif';
  ctx.fillText(sol.name, lx, ly);

  ctx.fillStyle = hexAlpha('#7d8590', 0.7 * alpha);
  ctx.font = '8px ui-monospace, monospace';
  ctx.fillText(sol.subtitle, lx, ly + 14);

  ctx.fillStyle = hexAlpha('#6a7280', 0.55 * alpha);
  ctx.font = '8px ui-monospace, monospace';
  ctx.fillText(sol.role, lx, ly + 26);
}

// ── Render frame ───────────────────────────────────────────────────────────
function draw() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);

  if (mode === 'atlas' || modeT < 1) {
    // Atlas alpha: 1 when in atlas mode, fading out when entering focus
    const atlasAlpha = mode === 'atlas' ? modeT : (1 - modeT);
    for (const slot of ATLAS_LAYOUT) {
      const sol = SOLIDS[slot.idx];
      const cx = slot.fx * W, cy = slot.fy * H;
      const scale = Math.min(W, H) * slot.scale;
      renderSolid(sol, cx, cy, scale, atlasAlpha, slot.idx === 0);
      drawAtlasLabel(slot, sol, W, H, atlasAlpha);
    }
  }

  if (mode === 'focus' || modeT < 1) {
    const focusAlpha = mode === 'focus' ? modeT : (1 - modeT);
    if (focusAlpha > 0.01) {
      const sol = SOLIDS[focusIdx];
      const cx = W/2, cy = H/2;
      const scale = Math.min(W, H) * 0.32;
      renderSolid(sol, cx, cy, scale, focusAlpha, true);
    }
  }

  // Advance transition
  if (modeT < 1) modeT = Math.min(1, modeT + 0.06);

  // Auto-rotate (atlas + focus share rotation — same constitution)
  if (!dragging) {
    ry += dry;
    rx += drx;
  }

  // UI sync (contract block visibility)
  const contractEl = document.getElementById('contract');
  if (mode === 'focus' && modeT > 0.4) {
    contractEl.classList.add('visible');
  } else {
    contractEl.classList.remove('visible');
  }
  document.getElementById('hint').style.opacity = (mode === 'atlas') ? '1' : '0';
}

// ── Mode transitions ──────────────────────────────────────────────────────
function enterFocus(idx) {
  if (mode === 'focus' && focusIdx === idx) return;
  focusIdx = idx;
  const sol = SOLIDS[idx];
  document.getElementById('solid-name').textContent = sol.name;
  document.getElementById('solid-role').textContent = sol.role;
  document.getElementById('solid-law').textContent = sol.law;
  document.getElementById('solid-name').style.color = sol.color;
  document.getElementById('solid-law').style.color = sol.color;
  document.getElementById('s-mode').textContent = 'FOCUS · ' + sol.name;
  if (mode !== 'focus') {
    mode = 'focus';
    modeT = 0;
  } else {
    modeT = 0; // crossfade between focuses too
  }
}

function exitFocus() {
  if (mode === 'atlas') return;
  mode = 'atlas';
  modeT = 0;
  document.getElementById('s-mode').textContent = 'ATLAS';
}

// ── Hit-test atlas slots ──────────────────────────────────────────────────
function hitAtlas(mx, my) {
  const W = canvas.width, H = canvas.height;
  for (const slot of ATLAS_LAYOUT) {
    const cx = slot.fx * W, cy = slot.fy * H;
    const r = Math.min(W, H) * slot.scale * 1.2;
    const dx = mx - cx, dy = my - cy;
    if (dx*dx + dy*dy < r*r) return slot.idx;
  }
  return -1;
}

// ── Input ──────────────────────────────────────────────────────────────────
canvas.addEventListener('mousedown', e => {
  dragging = true;
  lastX = e.clientX; lastY = e.clientY;
  mouseDownPos = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', e => {
  if (!dragging) return;
  dragging = false;
  // Click vs drag detection: small movement = click
  if (mouseDownPos) {
    const dx = e.clientX - mouseDownPos.x, dy = e.clientY - mouseDownPos.y;
    const moved = Math.sqrt(dx*dx + dy*dy);
    if (moved < 4) {
      // It's a click
      if (mode === 'atlas') {
        const hit = hitAtlas(e.clientX, e.clientY);
        if (hit >= 0) enterFocus(hit);
      } else {
        // Click outside focus solid bbox → exit
        const W = canvas.width, H = canvas.height;
        const cx = W/2, cy = H/2;
        const r = Math.min(W, H) * 0.32 * 1.3;
        const ddx = e.clientX - cx, ddy = e.clientY - cy;
        if (ddx*ddx + ddy*ddy > r*r) exitFocus();
      }
    }
  }
  mouseDownPos = null;
  dry = 0.004; drx = 0;
});

window.addEventListener('mousemove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  ry += dx * 0.01; rx += dy * 0.01;
  dry = dx * 0.003; drx = dy * 0.002;
  lastX = e.clientX; lastY = e.clientY;
});

window.addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= '5') enterFocus(+e.key - 1);
  else if (e.key === 'Escape') exitFocus();
});

// ── Init ───────────────────────────────────────────────────────────────────
function loop() { draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
