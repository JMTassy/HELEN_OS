<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>NEPTION — Living Hero Loop</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #02090f;
      }
      #scene {
        position: absolute;
        inset: 0;
      }
      /* Base plate — oversized so the ±10px descent drift never exposes edges */
      #plate-wrap {
        position: absolute;
        inset: -16px;
      }
      #plate-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      /* Light shafts — soft diagonal white-gold gradients, screen blend, upper half */
      .shaft {
        position: absolute;
        top: -220px;
        height: 900px;
        mix-blend-mode: screen;
        pointer-events: none;
        will-change: transform, opacity;
      }
      #shaft-a {
        left: 700px;
        width: 230px;
        opacity: 0.08;
        transform: rotate(16deg);
        transform-origin: 50% 0%;
        background: linear-gradient(
          90deg,
          rgba(255, 244, 214, 0) 0%,
          rgba(255, 244, 214, 0.7) 50%,
          rgba(255, 244, 214, 0) 100%
        );
      }
      #shaft-b {
        left: 1010px;
        width: 340px;
        opacity: 0.06;
        transform: rotate(-13deg);
        transform-origin: 50% 0%;
        background: linear-gradient(
          90deg,
          rgba(255, 238, 196, 0) 0%,
          rgba(255, 238, 196, 0.65) 45%,
          rgba(255, 238, 196, 0) 100%
        );
      }
      #shaft-c {
        left: 430px;
        width: 160px;
        opacity: 0.05;
        transform: rotate(25deg);
        transform-origin: 50% 0%;
        background: linear-gradient(
          90deg,
          rgba(255, 248, 226, 0) 0%,
          rgba(255, 248, 226, 0.75) 55%,
          rgba(255, 248, 226, 0) 100%
        );
      }
      /* Surface shimmer — repeating gradient strip translated whole periods per loop */
      #shimmer {
        position: absolute;
        top: 0;
        left: 0;
        width: 1920px;
        height: 150px;
        overflow: hidden;
        mix-blend-mode: screen;
        opacity: 0.35;
        pointer-events: none;
      }
      #shimmer-strip {
        position: absolute;
        top: 0;
        left: 0;
        width: 3840px;
        height: 100%;
        background: repeating-linear-gradient(
          90deg,
          rgba(255, 246, 216, 0) 0px,
          rgba(255, 246, 216, 0.35) 60px,
          rgba(255, 246, 216, 0) 120px,
          rgba(255, 240, 198, 0.18) 180px,
          rgba(255, 246, 216, 0) 240px
        );
        -webkit-mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0) 100%);
        mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0) 100%);
        will-change: transform;
      }
      /* Rising bubbles — generated synchronously from the literal table below */
      #bubbles {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .bubble {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.9);
        filter: blur(1.5px);
        opacity: 0;
        will-change: transform, opacity;
      }
      /* Archipelago pulse — radial gold glow over the seabed structure */
      #archi-glow {
        position: absolute;
        left: 540px;
        top: 780px;
        width: 880px;
        height: 320px;
        border-radius: 50%;
        mix-blend-mode: screen;
        opacity: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse at 50% 55%,
          rgba(255, 202, 110, 0.85) 0%,
          rgba(255, 186, 92, 0.35) 40%,
          rgba(255, 180, 80, 0) 70%
        );
        will-change: opacity;
      }
      /* Caption glint — once-per-loop sweep over 'NEPTION IA PRODUCTIONS' */
      #glint {
        position: absolute;
        left: 1195px;
        top: 552px;
        width: 590px;
        height: 52px;
        overflow: hidden;
        mix-blend-mode: screen;
        pointer-events: none;
      }
      #glint-strip {
        position: absolute;
        left: -90px;
        top: -10px;
        width: 70px;
        height: 72px;
        opacity: 0;
        transform: skewX(-20deg);
        background: linear-gradient(
          90deg,
          rgba(255, 232, 170, 0) 0%,
          rgba(255, 236, 180, 0.9) 50%,
          rgba(255, 232, 170, 0) 100%
        );
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <section id="scene" class="clip" data-start="0" data-duration="12" data-track-index="1">
        <div id="plate-wrap">
          <img id="plate-img" src="assets/plate.png" alt="" />
        </div>
        <div id="shaft-a" class="shaft"></div>
        <div id="shaft-b" class="shaft"></div>
        <div id="shaft-c" class="shaft"></div>
        <div id="shimmer"><div id="shimmer-strip" data-layout-allow-overflow></div></div>
        <div id="bubbles"></div>
        <div id="archi-glow"></div>
        <div id="glint"><div id="glint-strip"></div></div>
      </section>
    </div>

    <script>
      // NEPTION living hero — 12.0s seamless loop.
      // Every animation completes an integer number of cycles in exactly 12s,
      // so frame(t=0) == frame(t=12). No Math.random, no Date.now, no network fetch.
      window.__timelines = window.__timelines || {};

      // ---- Deterministic bubble field (literal table; no randomness) ----
      // x/top px · size px · cycle divides 12 · repeat = 12/cycle - 1 (literal)
      // rise px · peak opacity · phase in [0,1) desyncs the cycles.
      var BUBBLES = [
        { id: "bub01", x: 240,  top: 880, size: 5, cycle: 4,  repeat: 2, rise: 460, peak: 0.30, phase: 0.0  },
        { id: "bub02", x: 410,  top: 920, size: 3, cycle: 3,  repeat: 3, rise: 430, peak: 0.22, phase: 0.4  },
        { id: "bub03", x: 560,  top: 860, size: 6, cycle: 6,  repeat: 1, rise: 520, peak: 0.35, phase: 0.15 },
        { id: "bub04", x: 705,  top: 900, size: 4, cycle: 4,  repeat: 2, rise: 470, peak: 0.25, phase: 0.65 },
        { id: "bub05", x: 830,  top: 940, size: 2, cycle: 3,  repeat: 3, rise: 400, peak: 0.18, phase: 0.8  },
        { id: "bub06", x: 905,  top: 870, size: 7, cycle: 6,  repeat: 1, rise: 540, peak: 0.38, phase: 0.5  },
        { id: "bub07", x: 990,  top: 910, size: 3, cycle: 4,  repeat: 2, rise: 450, peak: 0.20, phase: 0.25 },
        { id: "bub08", x: 1120, top: 890, size: 5, cycle: 6,  repeat: 1, rise: 500, peak: 0.32, phase: 0.85 },
        { id: "bub09", x: 1260, top: 930, size: 4, cycle: 3,  repeat: 3, rise: 420, peak: 0.24, phase: 0.1  },
        { id: "bub10", x: 1395, top: 875, size: 6, cycle: 6,  repeat: 1, rise: 530, peak: 0.36, phase: 0.35 },
        { id: "bub11", x: 1520, top: 915, size: 3, cycle: 4,  repeat: 2, rise: 440, peak: 0.20, phase: 0.55 },
        { id: "bub12", x: 1650, top: 895, size: 5, cycle: 6,  repeat: 1, rise: 510, peak: 0.30, phase: 0.7  },
        { id: "bub13", x: 1760, top: 935, size: 2, cycle: 3,  repeat: 3, rise: 410, peak: 0.16, phase: 0.3  },
        { id: "bub14", x: 1080, top: 950, size: 4, cycle: 12, repeat: 0, rise: 560, peak: 0.28, phase: 0.0  }
      ];

      // Build bubble DOM synchronously, before the timeline is registered.
      var bubblesHost = document.getElementById("bubbles");
      BUBBLES.forEach(function (b) {
        var el = document.createElement("div");
        el.id = b.id;
        el.className = "bubble";
        el.style.left = b.x + "px";
        el.style.top = b.top + "px";
        el.style.width = b.size + "px";
        el.style.height = b.size + "px";
        bubblesHost.appendChild(el);
      });

      // Phase-shifted rise cycle expressed as percentage keyframes.
      // Shifted progress s in [0,1] maps to raw cycle phase u = (s + phase) mod 1.
      // y = -rise * u ; opacity = peak * sin(pi * u) — opacity is ~0 at both wrap
      // edges, so the sub-frame wrap jump is invisible and cycle end == cycle start.
      function bubbleKeyframes(b) {
        var kf = { easeEach: "none" };
        var w = 1 - b.phase; // shifted point where the raw cycle wraps 1 -> 0
        var pts = [];
        for (var i = 0; i <= 10; i++) {
          var s = i / 10;
          if (b.phase > 0 && Math.abs(s - w) < 0.005) continue; // avoid wrap collision
          pts.push(s);
        }
        if (b.phase > 0) {
          pts.push(w - 0.0001);
          pts.push(w + 0.0001);
        }
        pts.sort(function (a, c) { return a - c; });
        pts.forEach(function (s) {
          var u = b.phase === 0 ? s : (s + b.phase) % 1;
          if (b.phase > 0 && Math.abs(s - (w - 0.0001)) < 1e-9) u = 0.9999;
          var key = (s * 100).toFixed(3) + "%";
          kf[key] = {
            y: -(b.rise * u),
            opacity: b.peak * Math.sin(Math.PI * u)
          };
        });
        return kf;
      }

      var tl = gsap.timeline({ paused: true });

      // 1) DESCENT FEEL — plate drifts up 10px and settles back: one full yoyo
      //    cycle in 12s (6s up + 6s down), sine.inOut.
      tl.to("#plate-wrap", { y: -10, duration: 6, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0);

      // 2) LIGHT SHAFTS — integer cycle counts per 12s loop.
      //    Shaft A: 2 sway cycles (3s half-period x 4 plays) + 2 opacity pulses.
      tl.to("#shaft-a", { x: 44, duration: 3, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0);
      tl.to("#shaft-a", { opacity: 0.12, duration: 3, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0);
      //    Shaft B: 3 sway cycles (2s half-period x 6 plays) + 3 opacity pulses.
      tl.to("#shaft-b", { x: -52, duration: 2, yoyo: true, repeat: 5, ease: "sine.inOut" }, 0);
      tl.to("#shaft-b", { opacity: 0.11, duration: 2, yoyo: true, repeat: 5, ease: "sine.inOut" }, 0);
      //    Shaft C: 2 rotation cycles + 3 opacity pulses.
      tl.to("#shaft-c", { rotation: 22, duration: 3, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0);
      tl.to("#shaft-c", { opacity: 0.1, duration: 2, yoyo: true, repeat: 5, ease: "sine.inOut" }, 0);

      // 3) SURFACE SHIMMER — strip pattern period is 240px; translating exactly
      //    -1920px (8 whole periods) over 12s makes t=12 pixel-identical to t=0.
      tl.to("#shimmer-strip", { x: -1920, duration: 12, ease: "none" }, 0);

      // 4) RISING BUBBLES — each cycle divides 12s; finite literal repeats.
      BUBBLES.forEach(function (b) {
        tl.to("#" + b.id, {
          keyframes: bubbleKeyframes(b),
          duration: b.cycle,
          repeat: b.repeat,
          ease: "none"
        }, 0);
      });

      // 5) ARCHIPELAGO PULSE — 2 breath cycles: 0 -> 0.15 -> 0 (3s half-period x 4 plays).
      tl.to("#archi-glow", { opacity: 0.15, duration: 3, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0);

      // 6) CAPTION GLINT — one sweep per loop at t=6.0s; starts and ends fully
      //    hidden (opacity 0 + parked outside the overflow-hidden window).
      tl.to("#glint-strip", { x: 760, duration: 1.6, ease: "power1.inOut" }, 6.0);
      tl.to("#glint-strip", { opacity: 0.55, duration: 0.8, yoyo: true, repeat: 1, ease: "sine.inOut" }, 6.0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
